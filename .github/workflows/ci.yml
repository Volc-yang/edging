name: ci

on:
  push:
    branches: [main, feature/edge-world]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python test suite
        run: python -m unittest discover tests -v

      - name: edging 64D/384 structural validation
        run: |
          cd edging
          ruby bin/validate_spacetime_abstractions.rb --complete

      - name: Confirm the canonical corpus is in sync
        run: |
          cp engine/yijing_text.json /tmp/yijing_text.json.before
          ruby edging/bin/sync_engine_yijing_text.rb
          if ! diff -q /tmp/yijing_text.json.before engine/yijing_text.json; then
            echo "::error::engine/yijing_text.json is out of sync with the edging corpus."
            echo "Run: ruby edging/bin/sync_engine_yijing_text.rb"
            exit 1
          fi

# The Godot <-> UE5 parity gate and the UE5 commandlet are intentionally NOT
# run in CI: they need a local Godot 4.7 install and an Unreal Engine 5.8
# installation plus the external-SSD project. Run them locally with:
#   ./scripts/test.sh --all
