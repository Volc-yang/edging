lines:
- id: proto_hex_01_line_1
  king_wen_index: 1
  hexagram_name_cn: 乾
  line_index: 1
  text: 潜龙，勿用。
  commentary: "《象》曰：潜龙勿用，阳在下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_01_line_2
  king_wen_index: 1
  hexagram_name_cn: 乾
  line_index: 2
  text: 见龙在田，利见大人。
  commentary: "《象》曰：见龙在田，德施普也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_01_line_3
  king_wen_index: 1
  hexagram_name_cn: 乾
  line_index: 3
  text: 君子终日乾乾，夕惕若，厉，无咎。
  commentary: "《象》曰：终日乾乾，反复道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_01_line_4
  king_wen_index: 1
  hexagram_name_cn: 乾
  line_index: 4
  text: 或跃在渊，无咎。
  commentary: "《象》曰：或跃在渊，进无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_01_line_5
  king_wen_index: 1
  hexagram_name_cn: 乾
  line_index: 5
  text: 飞龙在天，利见大人。
  commentary: "《象》曰：飞龙在天，大人造也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_01_line_6
  king_wen_index: 1
  hexagram_name_cn: 乾
  line_index: 6
  text: 亢龙有悔。
  commentary: "《象》曰：亢龙有悔，盈不可久也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_02_line_1
  king_wen_index: 2
  hexagram_name_cn: 坤
  line_index: 1
  text: 履霜，坚冰至。
  commentary: "《象》曰：履霜坚冰，阴始凝也。驯致其道，至坚冰也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_02_line_2
  king_wen_index: 2
  hexagram_name_cn: 坤
  line_index: 2
  text: 直，方，大，不习无不利。
  commentary: "《象》曰：六二之动，直以方也。不习无不利，地道光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_02_line_3
  king_wen_index: 2
  hexagram_name_cn: 坤
  line_index: 3
  text: 含章可贞。或从王事，无成有终。
  commentary: "《象》曰：含章可贞；以时发也。或从王事，知光大也"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_02_line_4
  king_wen_index: 2
  hexagram_name_cn: 坤
  line_index: 4
  text: 括囊；无咎，无誉。
  commentary: "《象》曰：括囊无咎，慎不害也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_02_line_5
  king_wen_index: 2
  hexagram_name_cn: 坤
  line_index: 5
  text: 黄裳，元吉。
  commentary: "《象》曰：黄裳元吉，文在中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_02_line_6
  king_wen_index: 2
  hexagram_name_cn: 坤
  line_index: 6
  text: 龙战于野，其血玄黄。
  commentary: "《象》曰：战龙于野，其道穷也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_03_line_1
  king_wen_index: 3
  hexagram_name_cn: 屯
  line_index: 1
  text: 磐桓；利居贞，利建侯。
  commentary: "《象》曰：虽磐桓，志行正也。以贵下贱，大得民也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_03_line_2
  king_wen_index: 3
  hexagram_name_cn: 屯
  line_index: 2
  text: 屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。
  commentary: "《象》曰：六二之难，乘刚也。十年乃字，反常也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_03_line_3
  king_wen_index: 3
  hexagram_name_cn: 屯
  line_index: 3
  text: 即鹿无虞，惟入于林中，君子几不如舍，往吝。
  commentary: "《象》曰：即鹿无虞，以纵禽也。君子舍之，往吝穷也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_03_line_4
  king_wen_index: 3
  hexagram_name_cn: 屯
  line_index: 4
  text: 乘马班如，求婚媾，往吉，无不利。
  commentary: "《象》曰：求而往，明也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_03_line_5
  king_wen_index: 3
  hexagram_name_cn: 屯
  line_index: 5
  text: 屯其膏，小贞吉，大贞凶。
  commentary: "《象》曰：屯其膏，施未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_03_line_6
  king_wen_index: 3
  hexagram_name_cn: 屯
  line_index: 6
  text: 乘马班如，泣血涟如。
  commentary: "《象》曰：泣血涟如，何可长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_04_line_1
  king_wen_index: 4
  hexagram_name_cn: 蒙
  line_index: 1
  text: 发蒙，利用刑人，用说桎梏，以往吝。
  commentary: "《象》曰：利用刑人，以正法也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_04_line_2
  king_wen_index: 4
  hexagram_name_cn: 蒙
  line_index: 2
  text: 包蒙吉；纳妇吉；子克家。
  commentary: "《象》曰：子克家，刚柔接也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_04_line_3
  king_wen_index: 4
  hexagram_name_cn: 蒙
  line_index: 3
  text: 勿用娶女；见金夫，不有躬，无攸利。
  commentary: "《象》曰：勿用娶女，行不顺也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_04_line_4
  king_wen_index: 4
  hexagram_name_cn: 蒙
  line_index: 4
  text: 困蒙，吝。
  commentary: "《象》曰：困蒙之吝，独远实也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_04_line_5
  king_wen_index: 4
  hexagram_name_cn: 蒙
  line_index: 5
  text: 童蒙，吉。
  commentary: "《象》曰：童蒙之吉，顺以巽也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_04_line_6
  king_wen_index: 4
  hexagram_name_cn: 蒙
  line_index: 6
  text: 击蒙；不利为寇，利御寇。
  commentary: "《象》曰：利用御寇，上下顺也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_05_line_1
  king_wen_index: 5
  hexagram_name_cn: 需
  line_index: 1
  text: 需于郊。利用恒，无咎。
  commentary: "《象》曰：需于郊，不犯难行也。利用恒，无咎；未失常也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_05_line_2
  king_wen_index: 5
  hexagram_name_cn: 需
  line_index: 2
  text: 需于沙。小有言，终吉。
  commentary: "《象》曰：需于沙，衍在中也。虽小有言，以终吉也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_05_line_3
  king_wen_index: 5
  hexagram_name_cn: 需
  line_index: 3
  text: 需于泥，致寇至。
  commentary: "《象》曰：需于泥，灾在外也。自我致寇，敬慎不败也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_05_line_4
  king_wen_index: 5
  hexagram_name_cn: 需
  line_index: 4
  text: 需于血，出自穴。
  commentary: "《象》曰：需于血，顺以听也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_05_line_5
  king_wen_index: 5
  hexagram_name_cn: 需
  line_index: 5
  text: 需于酒食，贞吉。
  commentary: "《象》曰：酒食贞吉，以中正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_05_line_6
  king_wen_index: 5
  hexagram_name_cn: 需
  line_index: 6
  text: 入于穴，有不速之客三人来，敬之终吉。
  commentary: "《象》曰：不速之客来，敬之终吉。虽不当位，未大失也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_06_line_1
  king_wen_index: 6
  hexagram_name_cn: 讼
  line_index: 1
  text: 不永所事，小有言，终吉。
  commentary: "《象》曰：不永所事，讼不可长也。虽有小言，其辩明也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_06_line_2
  king_wen_index: 6
  hexagram_name_cn: 讼
  line_index: 2
  text: 不克讼，归而逋，其邑人三百户，无眚。
  commentary: "《象》曰：不克讼，归而逋也。自下讼上，患至掇也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_06_line_3
  king_wen_index: 6
  hexagram_name_cn: 讼
  line_index: 3
  text: 食旧德，贞厉，终吉，或从王事，无成。
  commentary: "《象》曰：食旧德，从上吉也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_06_line_4
  king_wen_index: 6
  hexagram_name_cn: 讼
  line_index: 4
  text: 不克讼，复即命渝，安贞吉。
  commentary: "《象》曰：复即命，渝安贞；不失也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_06_line_5
  king_wen_index: 6
  hexagram_name_cn: 讼
  line_index: 5
  text: 讼元吉。
  commentary: "《象》曰：讼元吉，以中正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_06_line_6
  king_wen_index: 6
  hexagram_name_cn: 讼
  line_index: 6
  text: 或锡之鞶带，终朝三褫之。
  commentary: "《象》曰：以讼受服，亦不足敬也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_07_line_1
  king_wen_index: 7
  hexagram_name_cn: 师
  line_index: 1
  text: 师出以律，否臧凶。
  commentary: "《象》曰：师出以律，失律凶也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_07_line_2
  king_wen_index: 7
  hexagram_name_cn: 师
  line_index: 2
  text: 在师中吉，无咎，王三锡命。
  commentary: "《象》曰：在师中吉，承天宠也。王三锡命，怀万邦也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_07_line_3
  king_wen_index: 7
  hexagram_name_cn: 师
  line_index: 3
  text: 师或舆尸，凶。
  commentary: "《象》曰：师或舆尸，大无功也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_07_line_4
  king_wen_index: 7
  hexagram_name_cn: 师
  line_index: 4
  text: 师左次，无咎。
  commentary: "《象》曰：左次无咎，未失常也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_07_line_5
  king_wen_index: 7
  hexagram_name_cn: 师
  line_index: 5
  text: 田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。
  commentary: "《象》曰：长子帅师，以中行也。弟子舆尸，使不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_07_line_6
  king_wen_index: 7
  hexagram_name_cn: 师
  line_index: 6
  text: 大君有命，开国承家，小人勿用。
  commentary: "《象》曰：大君有命，以正功也。小人勿用，必乱邦也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_08_line_1
  king_wen_index: 8
  hexagram_name_cn: 比
  line_index: 1
  text: 有孚，比之，无咎。有孚盈缶，终来有他，吉。
  commentary: "《象》曰：比之初六，有他吉也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_08_line_2
  king_wen_index: 8
  hexagram_name_cn: 比
  line_index: 2
  text: 比之自内，贞吉。
  commentary: "《象》曰：比之自内，不自失也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_08_line_3
  king_wen_index: 8
  hexagram_name_cn: 比
  line_index: 3
  text: 比之匪人。
  commentary: "《象》曰：比之匪人，不亦伤乎！"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_08_line_4
  king_wen_index: 8
  hexagram_name_cn: 比
  line_index: 4
  text: 外比之，贞吉。
  commentary: "《象》曰：外比于贤，以从上也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_08_line_5
  king_wen_index: 8
  hexagram_name_cn: 比
  line_index: 5
  text: 显比，王用三驱，失前禽。邑人不诫，吉。
  commentary: "《象》曰：显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_08_line_6
  king_wen_index: 8
  hexagram_name_cn: 比
  line_index: 6
  text: 比之无首，凶。
  commentary: "《象》曰：比之无首，无所终也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_09_line_1
  king_wen_index: 9
  hexagram_name_cn: 小畜
  line_index: 1
  text: 复自道，何其咎，吉。
  commentary: "《象》曰：复自道，其义吉也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_09_line_2
  king_wen_index: 9
  hexagram_name_cn: 小畜
  line_index: 2
  text: 牵复，吉。
  commentary: "《象》曰：牵复在中，亦不自失也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_09_line_3
  king_wen_index: 9
  hexagram_name_cn: 小畜
  line_index: 3
  text: 舆说辐，夫妻反目。
  commentary: "《象》曰：夫妻反目，不能正室也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_09_line_4
  king_wen_index: 9
  hexagram_name_cn: 小畜
  line_index: 4
  text: 有孚，血去惕出，无咎。
  commentary: "《象》曰：有孚惕出，上合志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_09_line_5
  king_wen_index: 9
  hexagram_name_cn: 小畜
  line_index: 5
  text: 有孚挛如，富以其邻。
  commentary: "《象》曰：有孚挛如，不独富也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_09_line_6
  king_wen_index: 9
  hexagram_name_cn: 小畜
  line_index: 6
  text: 既雨既处，尚德载，妇贞厉。月几望，君子征凶。
  commentary: "《象》曰：既雨既处，德积载也。君子征凶，有所疑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_10_line_1
  king_wen_index: 10
  hexagram_name_cn: 履
  line_index: 1
  text: 素履，往无咎。
  commentary: "《象》曰：素履之往，独行愿也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_10_line_2
  king_wen_index: 10
  hexagram_name_cn: 履
  line_index: 2
  text: 履道坦坦，幽人贞吉。
  commentary: "《象》曰：幽人贞吉，中不自乱也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_10_line_3
  king_wen_index: 10
  hexagram_name_cn: 履
  line_index: 3
  text: 眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。
  commentary: "《象》曰：眇能视；不足以有明也。跛能履；不足以与行也，咥人之凶；位不当也。武人为于大君；志刚也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_10_line_4
  king_wen_index: 10
  hexagram_name_cn: 履
  line_index: 4
  text: 履虎尾，诉诉，终吉。
  commentary: "《象》曰：诉诉终吉，志行也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_10_line_5
  king_wen_index: 10
  hexagram_name_cn: 履
  line_index: 5
  text: 夬履，贞厉。
  commentary: "《象》曰：夬履贞厉，位正当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_10_line_6
  king_wen_index: 10
  hexagram_name_cn: 履
  line_index: 6
  text: 视履考祥，其旋元吉。
  commentary: "《象》曰：元吉在上，大有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_11_line_1
  king_wen_index: 11
  hexagram_name_cn: 泰
  line_index: 1
  text: 拔茅茹，以其彙，征吉。
  commentary: "《象》曰：拔茅征吉，志在外也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_11_line_2
  king_wen_index: 11
  hexagram_name_cn: 泰
  line_index: 2
  text: 包荒，用馮河，不遐遺，朋亡，得尚于中行。
  commentary: "《象》曰：包荒，得尚于中行，以光大也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_11_line_3
  king_wen_index: 11
  hexagram_name_cn: 泰
  line_index: 3
  text: 无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。
  commentary: "《象》曰：无往不復，天地際也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_11_line_4
  king_wen_index: 11
  hexagram_name_cn: 泰
  line_index: 4
  text: 翩翩，不富，以其鄰，不戒以孚。
  commentary: "《象》曰：翩翩不富，皆失實也。不戒以孚，中心願也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_11_line_5
  king_wen_index: 11
  hexagram_name_cn: 泰
  line_index: 5
  text: 帝乙歸妹，以祉元吉。
  commentary: "《象》曰：以祉元吉，中以行愿也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_11_line_6
  king_wen_index: 11
  hexagram_name_cn: 泰
  line_index: 6
  text: 城復于隍，勿用師。自邑告命，貞吝。
  commentary: "《象》曰：城復于隍，其命亂也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_12_line_1
  king_wen_index: 12
  hexagram_name_cn: 否
  line_index: 1
  text: 拔茅茹，以其汇，贞吉亨。
  commentary: "《象》曰：拔茅贞吉，志在君也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_12_line_2
  king_wen_index: 12
  hexagram_name_cn: 否
  line_index: 2
  text: 包承。小人吉，大人否，亨。
  commentary: "《象》曰：大人否亨，不乱群也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_12_line_3
  king_wen_index: 12
  hexagram_name_cn: 否
  line_index: 3
  text: 包羞。
  commentary: "《象》曰：包羞，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_12_line_4
  king_wen_index: 12
  hexagram_name_cn: 否
  line_index: 4
  text: 有命，无咎，畴离祉。
  commentary: "《象》曰：有命无咎，志行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_12_line_5
  king_wen_index: 12
  hexagram_name_cn: 否
  line_index: 5
  text: 休否，大人吉。其亡其亡，系于苞桑。
  commentary: "《象》曰：大人之吉，位正当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_12_line_6
  king_wen_index: 12
  hexagram_name_cn: 否
  line_index: 6
  text: 倾否，先否后喜。
  commentary: "《象》曰：否终则倾，何可长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_13_line_1
  king_wen_index: 13
  hexagram_name_cn: 同人
  line_index: 1
  text: 同人于门，无咎。
  commentary: "《象》曰：出门同人，又谁咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_13_line_2
  king_wen_index: 13
  hexagram_name_cn: 同人
  line_index: 2
  text: 同人于宗，吝。
  commentary: "《象》曰：同人于宗，吝道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_13_line_3
  king_wen_index: 13
  hexagram_name_cn: 同人
  line_index: 3
  text: 伏戎于莽，升其高陵，三岁不兴。
  commentary: "《象》曰：伏戎于莽，敌刚也。三岁不兴，安行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_13_line_4
  king_wen_index: 13
  hexagram_name_cn: 同人
  line_index: 4
  text: 乘其墉，弗克攻，吉。
  commentary: "《象》曰：乘其墉，义弗克也，其吉，则困而反则也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_13_line_5
  king_wen_index: 13
  hexagram_name_cn: 同人
  line_index: 5
  text: 同人，先号啕而后笑。大师克相遇。
  commentary: "《象》曰：同人之先，以中直也。大师相遇，言相克也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_13_line_6
  king_wen_index: 13
  hexagram_name_cn: 同人
  line_index: 6
  text: 同人于郊，无悔。
  commentary: "《象》曰：同人于郊，志未得也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_14_line_1
  king_wen_index: 14
  hexagram_name_cn: 大有
  line_index: 1
  text: 无交害，匪咎，艰则无咎。
  commentary: "《象》曰：大有初九，无交害也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_14_line_2
  king_wen_index: 14
  hexagram_name_cn: 大有
  line_index: 2
  text: 大车以载，有攸往，无咎。
  commentary: "《象》曰：大车以载，积中不败也。"
  source_status: reviewed_variant
  resolution: objective_copy_defect_corrected_from_check_source
- id: proto_hex_14_line_3
  king_wen_index: 14
  hexagram_name_cn: 大有
  line_index: 3
  text: 公用亨于天子，小人弗克。
  commentary: "《象》曰：公用亨于天子，小人害也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_14_line_4
  king_wen_index: 14
  hexagram_name_cn: 大有
  line_index: 4
  text: 匪其彭，无咎。
  commentary: "《象》曰：匪其彭，无咎；明辨晰也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_14_line_5
  king_wen_index: 14
  hexagram_name_cn: 大有
  line_index: 5
  text: 厥孚交如，威如；吉。
  commentary: "《象》曰：厥孚交如，信以发志也。威如之吉，易而无备也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_14_line_6
  king_wen_index: 14
  hexagram_name_cn: 大有
  line_index: 6
  text: 自天佑之，吉无不利。
  commentary: "《象》曰：大有上吉，自天佑也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_15_line_1
  king_wen_index: 15
  hexagram_name_cn: 谦
  line_index: 1
  text: 谦谦君子，用涉大川，吉。
  commentary: "《象》曰：谦谦君子，卑以自牧也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_15_line_2
  king_wen_index: 15
  hexagram_name_cn: 谦
  line_index: 2
  text: 鸣谦，贞吉。
  commentary: "《象》曰：鸣谦贞吉，中心得也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_15_line_3
  king_wen_index: 15
  hexagram_name_cn: 谦
  line_index: 3
  text: 劳谦，君子有终，吉。
  commentary: "《象》曰：劳谦君子，万民服也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_15_line_4
  king_wen_index: 15
  hexagram_name_cn: 谦
  line_index: 4
  text: 无不利，撝谦。
  commentary: "《象》曰：无不利，撝谦；不违则也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_15_line_5
  king_wen_index: 15
  hexagram_name_cn: 谦
  line_index: 5
  text: 不富，以其邻，利用侵伐，无不利。
  commentary: "《象》曰：利用侵伐，征不服也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_15_line_6
  king_wen_index: 15
  hexagram_name_cn: 谦
  line_index: 6
  text: 鸣谦，利用行师，征邑国。
  commentary: "《象》曰：鸣谦，志未得也。可用行师，征邑国也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_16_line_1
  king_wen_index: 16
  hexagram_name_cn: 豫
  line_index: 1
  text: 鸣豫，凶。
  commentary: "《象》曰：初六鸣豫，志穷凶也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_16_line_2
  king_wen_index: 16
  hexagram_name_cn: 豫
  line_index: 2
  text: 介于石，不终日，贞吉。
  commentary: "《象》曰：不终日，贞吉；以中正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_16_line_3
  king_wen_index: 16
  hexagram_name_cn: 豫
  line_index: 3
  text: 盱豫，悔。迟有悔。
  commentary: "《象》曰：盱豫有悔，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_16_line_4
  king_wen_index: 16
  hexagram_name_cn: 豫
  line_index: 4
  text: 由豫，大有得。勿疑。朋盍簪。
  commentary: "《象》曰：由豫，大有得；志大行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_16_line_5
  king_wen_index: 16
  hexagram_name_cn: 豫
  line_index: 5
  text: 贞疾，恒不死。
  commentary: "《象》曰：六五贞疾，乘刚也。恒不死，中未亡也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_16_line_6
  king_wen_index: 16
  hexagram_name_cn: 豫
  line_index: 6
  text: 冥豫，成有渝，无咎。
  commentary: "《象》曰：冥豫在上，何可长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_17_line_1
  king_wen_index: 17
  hexagram_name_cn: 随
  line_index: 1
  text: 官有渝，贞吉。出门交有功。
  commentary: "《象》曰：官有渝，从正吉也。出门交有功，不失也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_17_line_2
  king_wen_index: 17
  hexagram_name_cn: 随
  line_index: 2
  text: 系小子，失丈夫。
  commentary: "《象》曰：系小子，弗兼与也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_17_line_3
  king_wen_index: 17
  hexagram_name_cn: 随
  line_index: 3
  text: 系丈夫，失小子。随有求得，利居贞。
  commentary: "《象》曰：系丈夫，志舍下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_17_line_4
  king_wen_index: 17
  hexagram_name_cn: 随
  line_index: 4
  text: 随有获，贞凶。有孚在道，以明，何咎。
  commentary: "《象》曰：随有获，其义凶也。有孚在道，明功也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_17_line_5
  king_wen_index: 17
  hexagram_name_cn: 随
  line_index: 5
  text: 孚于嘉，吉。
  commentary: "《象》曰：孚于嘉，吉；位正中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_17_line_6
  king_wen_index: 17
  hexagram_name_cn: 随
  line_index: 6
  text: 拘系之，乃从维之。王用亨于西山。
  commentary: "《象》曰：拘系之，上穷也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_18_line_1
  king_wen_index: 18
  hexagram_name_cn: 蛊
  line_index: 1
  text: 干父之蛊，有子，考无咎，厉终吉。
  commentary: "《象》曰：干父之蛊，意承考也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_18_line_2
  king_wen_index: 18
  hexagram_name_cn: 蛊
  line_index: 2
  text: 干母之蛊，不可贞。
  commentary: "《象》曰：干母之蛊，得中道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_18_line_3
  king_wen_index: 18
  hexagram_name_cn: 蛊
  line_index: 3
  text: 干父之蛊，小有悔，无大咎。
  commentary: "《象》曰：干父之蛊，终无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_18_line_4
  king_wen_index: 18
  hexagram_name_cn: 蛊
  line_index: 4
  text: 裕父之蛊，往见吝。
  commentary: "《象》曰：裕父之蛊，往未得也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_18_line_5
  king_wen_index: 18
  hexagram_name_cn: 蛊
  line_index: 5
  text: 干父之蛊，用誉。
  commentary: "《象》曰：干父之蛊；承以德也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_18_line_6
  king_wen_index: 18
  hexagram_name_cn: 蛊
  line_index: 6
  text: 不事王侯，高尚其事。
  commentary: "《象》曰：不事王侯，志可则也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_19_line_1
  king_wen_index: 19
  hexagram_name_cn: 临
  line_index: 1
  text: 咸临，贞吉。
  commentary: "《象》曰：咸临贞吉，志行正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_19_line_2
  king_wen_index: 19
  hexagram_name_cn: 临
  line_index: 2
  text: 咸临，吉无不利。
  commentary: "《象》曰：咸临，吉无不利；未顺命也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_19_line_3
  king_wen_index: 19
  hexagram_name_cn: 临
  line_index: 3
  text: 甘临，无攸利。既忧之，无咎。
  commentary: "《象》曰：甘临，位不当也。既忧之，咎不长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_19_line_4
  king_wen_index: 19
  hexagram_name_cn: 临
  line_index: 4
  text: 至临，无咎。
  commentary: "《象》曰：至临无咎，位当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_19_line_5
  king_wen_index: 19
  hexagram_name_cn: 临
  line_index: 5
  text: 知临，大君之宜，吉。
  commentary: "《象》曰：大君之宜，行中之谓也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_19_line_6
  king_wen_index: 19
  hexagram_name_cn: 临
  line_index: 6
  text: 敦临，吉无咎。
  commentary: "《象》曰：敦临之吉，志在内也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_20_line_1
  king_wen_index: 20
  hexagram_name_cn: 观
  line_index: 1
  text: 童观，小人无咎，君子吝。
  commentary: "《象》曰：初六童观，小人道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_20_line_2
  king_wen_index: 20
  hexagram_name_cn: 观
  line_index: 2
  text: 窥观，利女贞。
  commentary: "《象》曰：窥观女贞，亦可丑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_20_line_3
  king_wen_index: 20
  hexagram_name_cn: 观
  line_index: 3
  text: 观我生，进退。
  commentary: "《象》曰：观我生，进退；未失道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_20_line_4
  king_wen_index: 20
  hexagram_name_cn: 观
  line_index: 4
  text: 观国之光，利用宾于王。
  commentary: "《象》曰：观国之光，尚宾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_20_line_5
  king_wen_index: 20
  hexagram_name_cn: 观
  line_index: 5
  text: 观我生，君子无咎。
  commentary: "《象》曰：观我生，观民也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_20_line_6
  king_wen_index: 20
  hexagram_name_cn: 观
  line_index: 6
  text: 观其生，君子无咎。
  commentary: "《象》曰：观其生，志未平也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_21_line_1
  king_wen_index: 21
  hexagram_name_cn: 噬嗑
  line_index: 1
  text: 屦校灭趾，无咎。
  commentary: "《象》曰：屦校灭趾，不行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_21_line_2
  king_wen_index: 21
  hexagram_name_cn: 噬嗑
  line_index: 2
  text: 噬肤灭鼻，无咎。
  commentary: "《象》曰：噬肤灭鼻，乘刚也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_21_line_3
  king_wen_index: 21
  hexagram_name_cn: 噬嗑
  line_index: 3
  text: 噬腊肉，遇毒；小吝，无咎。
  commentary: "《象》曰：遇毒，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_21_line_4
  king_wen_index: 21
  hexagram_name_cn: 噬嗑
  line_index: 4
  text: 噬乾胏，得金矢，利艰贞，吉。
  commentary: "《象》曰：利艰贞吉，未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_21_line_5
  king_wen_index: 21
  hexagram_name_cn: 噬嗑
  line_index: 5
  text: 噬乾肉，得黄金，贞厉，无咎。
  commentary: "《象》曰：贞厉无咎，得当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_21_line_6
  king_wen_index: 21
  hexagram_name_cn: 噬嗑
  line_index: 6
  text: 何校灭耳，凶。
  commentary: "《象》曰：何校灭耳，聪不明也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_22_line_1
  king_wen_index: 22
  hexagram_name_cn: 贲
  line_index: 1
  text: 贲其趾，舍车而徒。
  commentary: "《象》曰：舍车而徒，义弗乘也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_22_line_2
  king_wen_index: 22
  hexagram_name_cn: 贲
  line_index: 2
  text: 贲其须。
  commentary: "《象》曰：贲其须，与上兴也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_22_line_3
  king_wen_index: 22
  hexagram_name_cn: 贲
  line_index: 3
  text: 贲如濡如，永贞吉。
  commentary: "《象》曰：永贞之吉，终莫之陵也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_22_line_4
  king_wen_index: 22
  hexagram_name_cn: 贲
  line_index: 4
  text: 贲如皤如，白马翰如，匪寇婚媾。
  commentary: "《象》曰：六四，当位疑也。匪寇婚媾，终无尤也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_22_line_5
  king_wen_index: 22
  hexagram_name_cn: 贲
  line_index: 5
  text: 贲于丘园，束帛戋戋，吝，终吉。
  commentary: "《象》曰：六五之吉，有喜也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_22_line_6
  king_wen_index: 22
  hexagram_name_cn: 贲
  line_index: 6
  text: 白贲，无咎。
  commentary: "《象》曰：白贲无咎，上得志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_23_line_1
  king_wen_index: 23
  hexagram_name_cn: 剥
  line_index: 1
  text: 剥床以足，蔑贞凶。
  commentary: "《象》曰：剥床以足，以灭下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_23_line_2
  king_wen_index: 23
  hexagram_name_cn: 剥
  line_index: 2
  text: 剥床以辨，蔑贞凶。
  commentary: "《象》曰：剥床以辨，未有与也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_23_line_3
  king_wen_index: 23
  hexagram_name_cn: 剥
  line_index: 3
  text: 剥之，无咎。
  commentary: "《象》曰：剥之无咎，失上下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_23_line_4
  king_wen_index: 23
  hexagram_name_cn: 剥
  line_index: 4
  text: 剥床以肤，凶。
  commentary: "《象》曰：剥床以肤，切近灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_23_line_5
  king_wen_index: 23
  hexagram_name_cn: 剥
  line_index: 5
  text: 贯鱼，以宫人宠，无不利。
  commentary: "《象》曰：以宫人宠，终无尤也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_23_line_6
  king_wen_index: 23
  hexagram_name_cn: 剥
  line_index: 6
  text: 硕果不食，君子得舆，小人剥庐。
  commentary: "《象》曰：君子得舆，民所载也。小人剥庐，终不可用也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_24_line_1
  king_wen_index: 24
  hexagram_name_cn: 复
  line_index: 1
  text: 不复远，无祗悔，元吉。
  commentary: "《象》曰：不远之复，以修身也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_24_line_2
  king_wen_index: 24
  hexagram_name_cn: 复
  line_index: 2
  text: 休复，吉。
  commentary: "《象》曰：休复之吉，以下仁也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_24_line_3
  king_wen_index: 24
  hexagram_name_cn: 复
  line_index: 3
  text: 频复，厉无咎。
  commentary: "《象》曰：频复之厉，义无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_24_line_4
  king_wen_index: 24
  hexagram_name_cn: 复
  line_index: 4
  text: 中行独复。
  commentary: "《象》曰：中行独复，以从道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_24_line_5
  king_wen_index: 24
  hexagram_name_cn: 复
  line_index: 5
  text: 敦复，无悔。
  commentary: "《象》曰：敦复无悔，中以自考也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_24_line_6
  king_wen_index: 24
  hexagram_name_cn: 复
  line_index: 6
  text: 迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。
  commentary: "《象》曰：迷复之凶，反君道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_25_line_1
  king_wen_index: 25
  hexagram_name_cn: 无妄
  line_index: 1
  text: 无妄，往吉。
  commentary: "《象》曰：无妄之往，得志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_25_line_2
  king_wen_index: 25
  hexagram_name_cn: 无妄
  line_index: 2
  text: 不耕获，不灾畲，则利有攸往。
  commentary: "《象》曰：不耕获，未富也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_25_line_3
  king_wen_index: 25
  hexagram_name_cn: 无妄
  line_index: 3
  text: 无妄之灾，或系之牛，行人之得，邑人之灾。
  commentary: "《象》曰：行人得牛，邑人灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_25_line_4
  king_wen_index: 25
  hexagram_name_cn: 无妄
  line_index: 4
  text: 可贞，无咎。
  commentary: "《象》曰：可贞无咎，固有之也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_25_line_5
  king_wen_index: 25
  hexagram_name_cn: 无妄
  line_index: 5
  text: 无妄之疾，勿药有喜。
  commentary: "《象》曰：无妄之药，不可试也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_25_line_6
  king_wen_index: 25
  hexagram_name_cn: 无妄
  line_index: 6
  text: 无妄，行有眚，无攸利。
  commentary: "《象》曰：无妄之行，穷之灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_26_line_1
  king_wen_index: 26
  hexagram_name_cn: 大畜
  line_index: 1
  text: 有厉利已。
  commentary: "《象》曰：有厉利已，不犯灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_26_line_2
  king_wen_index: 26
  hexagram_name_cn: 大畜
  line_index: 2
  text: 舆说輹。
  commentary: "《象》曰：舆说輹，中无尤也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_26_line_3
  king_wen_index: 26
  hexagram_name_cn: 大畜
  line_index: 3
  text: 良马逐，利艰贞。曰闲舆卫，利有攸往。
  commentary: "《象》曰：利有攸往，上合志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_26_line_4
  king_wen_index: 26
  hexagram_name_cn: 大畜
  line_index: 4
  text: 童牛之牿，元吉。
  commentary: "《象》曰：六四元吉，有喜也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_26_line_5
  king_wen_index: 26
  hexagram_name_cn: 大畜
  line_index: 5
  text: 豶豕之牙，吉。
  commentary: "《象》曰：六五之吉，有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_26_line_6
  king_wen_index: 26
  hexagram_name_cn: 大畜
  line_index: 6
  text: 何天之衢，亨。
  commentary: "《象》曰：何天之衢，道大行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_27_line_1
  king_wen_index: 27
  hexagram_name_cn: 颐
  line_index: 1
  text: 舍尔灵龟，观我朵颐，凶。
  commentary: "《象》曰：观我朵颐，亦不足贵也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_27_line_2
  king_wen_index: 27
  hexagram_name_cn: 颐
  line_index: 2
  text: 颠颐，拂经，于丘颐，征凶。
  commentary: "《象》曰：六二征凶，行失类也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_27_line_3
  king_wen_index: 27
  hexagram_name_cn: 颐
  line_index: 3
  text: 拂颐，贞凶，十年勿用，无攸利。
  commentary: "《象》曰：十年勿用，道大悖也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_27_line_4
  king_wen_index: 27
  hexagram_name_cn: 颐
  line_index: 4
  text: 颠颐，吉，虎视眈眈，其欲逐逐，无咎。
  commentary: "《象》曰：颠颐之吉，上施光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_27_line_5
  king_wen_index: 27
  hexagram_name_cn: 颐
  line_index: 5
  text: 拂经，居贞吉，不可涉大川。
  commentary: "《象》曰：居贞之吉，顺以从上也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_27_line_6
  king_wen_index: 27
  hexagram_name_cn: 颐
  line_index: 6
  text: 由颐，厉吉，利涉大川。
  commentary: "《象》曰：由颐厉吉，大有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_28_line_1
  king_wen_index: 28
  hexagram_name_cn: 大过
  line_index: 1
  text: 藉用白茅，无咎。
  commentary: "《象》曰：藉用白茅，柔在下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_28_line_2
  king_wen_index: 28
  hexagram_name_cn: 大过
  line_index: 2
  text: 枯杨生稊，老夫得其女妻，无不利。
  commentary: "《象》曰：老夫女妻，过以相与也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_28_line_3
  king_wen_index: 28
  hexagram_name_cn: 大过
  line_index: 3
  text: 栋桡，凶。
  commentary: "《象》曰：栋桡之凶，不可以有辅也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_28_line_4
  king_wen_index: 28
  hexagram_name_cn: 大过
  line_index: 4
  text: 栋隆，吉；有它吝。
  commentary: "《象》曰：栋隆之吉，不桡乎下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_28_line_5
  king_wen_index: 28
  hexagram_name_cn: 大过
  line_index: 5
  text: 枯杨生华，老妇得士夫，无咎无誉。
  commentary: "《象》曰：枯杨生华，何可久也。老妇士夫，亦可丑也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_28_line_6
  king_wen_index: 28
  hexagram_name_cn: 大过
  line_index: 6
  text: 过涉灭顶，凶，无咎。
  commentary: "《象》曰：过涉之凶，不可咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_29_line_1
  king_wen_index: 29
  hexagram_name_cn: 坎
  line_index: 1
  text: 习坎，入于坎窞，凶。
  commentary: "《象》曰：习坎入坎，失道凶也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_29_line_2
  king_wen_index: 29
  hexagram_name_cn: 坎
  line_index: 2
  text: 坎有险，求小得。
  commentary: "《象》曰：求小得，未出中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_29_line_3
  king_wen_index: 29
  hexagram_name_cn: 坎
  line_index: 3
  text: 来之坎坎，险且枕，入于坎窞，勿用。
  commentary: "《象》曰：来之坎坎，终无功也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_29_line_4
  king_wen_index: 29
  hexagram_name_cn: 坎
  line_index: 4
  text: 樽酒簋贰，用缶，纳约自牖，终无咎。
  commentary: "《象》曰：樽酒簋贰，刚柔际也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_29_line_5
  king_wen_index: 29
  hexagram_name_cn: 坎
  line_index: 5
  text: 坎不盈，祗既平，无咎。
  commentary: "《象》曰：坎不盈，中未大也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_29_line_6
  king_wen_index: 29
  hexagram_name_cn: 坎
  line_index: 6
  text: 系用徽纆，置于丛棘，三岁不得，凶。
  commentary: "《象》曰：上六失道，凶三岁也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_30_line_1
  king_wen_index: 30
  hexagram_name_cn: 离
  line_index: 1
  text: 履错然，敬之无咎。
  commentary: "《象》曰：履错之敬，以辟咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_30_line_2
  king_wen_index: 30
  hexagram_name_cn: 离
  line_index: 2
  text: 黄离，元吉。
  commentary: "《象》曰：黄离元吉，得中道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_30_line_3
  king_wen_index: 30
  hexagram_name_cn: 离
  line_index: 3
  text: 日昃之离，不鼓缶而歌，则大耋之嗟，凶。
  commentary: "《象》曰：日昃之离，何可久也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_30_line_4
  king_wen_index: 30
  hexagram_name_cn: 离
  line_index: 4
  text: 突如其来如，焚如，死如，弃如。
  commentary: "《象》曰：突如其来如，无所容也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_30_line_5
  king_wen_index: 30
  hexagram_name_cn: 离
  line_index: 5
  text: 出涕沱若，戚嗟若，吉。
  commentary: "《象》曰：六五之吉，离王公也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_30_line_6
  king_wen_index: 30
  hexagram_name_cn: 离
  line_index: 6
  text: 王用出征，有嘉折首，获匪其丑，无咎。
  commentary: "《象》曰：王用出征，以正邦也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_31_line_1
  king_wen_index: 31
  hexagram_name_cn: 咸
  line_index: 1
  text: 咸其拇。
  commentary: "《象》曰：咸其拇，志在外也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_31_line_2
  king_wen_index: 31
  hexagram_name_cn: 咸
  line_index: 2
  text: 咸其腓，凶，居吉。
  commentary: "《象》曰：虽凶居吉，顺不害也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_31_line_3
  king_wen_index: 31
  hexagram_name_cn: 咸
  line_index: 3
  text: 咸其股，执其随，往吝。
  commentary: "《象》曰：咸其股，亦不处也。志在随人，所执下也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_31_line_4
  king_wen_index: 31
  hexagram_name_cn: 咸
  line_index: 4
  text: 贞吉，悔亡，憧憧往来，朋从尔思。
  commentary: "《象》曰：贞吉悔亡，未感害也。憧憧往来，未光大也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_31_line_5
  king_wen_index: 31
  hexagram_name_cn: 咸
  line_index: 5
  text: 咸其脢，无悔。
  commentary: "《象》曰：咸其脢，志末也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_31_line_6
  king_wen_index: 31
  hexagram_name_cn: 咸
  line_index: 6
  text: 咸其辅颊舌。
  commentary: "《象》曰：咸其辅颊舌，滕口说也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_32_line_1
  king_wen_index: 32
  hexagram_name_cn: 恒
  line_index: 1
  text: 浚恒，贞凶，无攸利。
  commentary: "《象》曰：浚恒之凶，始求深也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_32_line_2
  king_wen_index: 32
  hexagram_name_cn: 恒
  line_index: 2
  text: 悔亡。
  commentary: "《象》曰：九二悔亡，能久中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_32_line_3
  king_wen_index: 32
  hexagram_name_cn: 恒
  line_index: 3
  text: 不恒其德，或承之羞，贞吝。
  commentary: "《象》曰：不恒其德，无所容也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_32_line_4
  king_wen_index: 32
  hexagram_name_cn: 恒
  line_index: 4
  text: 田无禽。
  commentary: "《象》曰：久非其位，安得禽也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_32_line_5
  king_wen_index: 32
  hexagram_name_cn: 恒
  line_index: 5
  text: 恒其德，贞，妇人吉，夫子凶。
  commentary: "《象》曰：妇人贞吉，从一而终也。夫子制义，从妇凶也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_32_line_6
  king_wen_index: 32
  hexagram_name_cn: 恒
  line_index: 6
  text: 振恒，凶。
  commentary: "《象》曰：振恒在上，大无功也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_33_line_1
  king_wen_index: 33
  hexagram_name_cn: 遯
  line_index: 1
  text: 遯尾，厉，勿用有攸往。
  commentary: "《象》曰：遯尾之厉，不往何灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_33_line_2
  king_wen_index: 33
  hexagram_name_cn: 遯
  line_index: 2
  text: 执之用黄牛之革，莫之胜说。
  commentary: "《象》曰：执用黄牛，固志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_33_line_3
  king_wen_index: 33
  hexagram_name_cn: 遯
  line_index: 3
  text: 系遯，有疾厉，畜臣妾吉。
  commentary: "《象》曰：系遯之厉，有疾惫也。畜臣妾吉，不可大事也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_33_line_4
  king_wen_index: 33
  hexagram_name_cn: 遯
  line_index: 4
  text: 好遯，君子吉，小人否。
  commentary: "《象》曰：君子好遯，小人否也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_33_line_5
  king_wen_index: 33
  hexagram_name_cn: 遯
  line_index: 5
  text: 嘉遯，贞吉。
  commentary: "《象》曰：嘉遯贞吉，以正志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_33_line_6
  king_wen_index: 33
  hexagram_name_cn: 遯
  line_index: 6
  text: 肥遯，无不利。
  commentary: "《象》曰：肥遯，无不利；无所疑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_34_line_1
  king_wen_index: 34
  hexagram_name_cn: 大壮
  line_index: 1
  text: 壮于趾，征凶，有孚。
  commentary: "《象》曰：壮于趾，其孚穷也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_34_line_2
  king_wen_index: 34
  hexagram_name_cn: 大壮
  line_index: 2
  text: 贞吉。
  commentary: "《象》曰：九二贞吉，以中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_34_line_3
  king_wen_index: 34
  hexagram_name_cn: 大壮
  line_index: 3
  text: 小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。
  commentary: "《象》曰：小人用壮，君子罔也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_34_line_4
  king_wen_index: 34
  hexagram_name_cn: 大壮
  line_index: 4
  text: 贞吉悔亡，藩决不羸，壮于大舆之輹。
  commentary: "《象》曰：藩决不羸，尚往也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_34_line_5
  king_wen_index: 34
  hexagram_name_cn: 大壮
  line_index: 5
  text: 丧羊于易，无悔。
  commentary: "《象》曰：丧羊于易，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_34_line_6
  king_wen_index: 34
  hexagram_name_cn: 大壮
  line_index: 6
  text: 羝羊触藩，不能退，不能遂，无攸利，艰则吉。
  commentary: "《象》曰：不能退，不能遂，不祥也。艰则吉，咎不长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_35_line_1
  king_wen_index: 35
  hexagram_name_cn: 晋
  line_index: 1
  text: 晋如，摧如，贞吉。罔孚，裕无咎。
  commentary: "《象》曰：晋如，摧如；独行正也。裕无咎；未受命也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_35_line_2
  king_wen_index: 35
  hexagram_name_cn: 晋
  line_index: 2
  text: 晋如，愁如，贞吉。受兹介福，于其王母。
  commentary: "《象》曰：受之介福，以中正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_35_line_3
  king_wen_index: 35
  hexagram_name_cn: 晋
  line_index: 3
  text: 众允，悔亡。
  commentary: "《象》曰：众允之，志上行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_35_line_4
  king_wen_index: 35
  hexagram_name_cn: 晋
  line_index: 4
  text: 晋如硕鼠，贞厉。
  commentary: "《象》曰：硕鼠贞厉，位不当也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_35_line_5
  king_wen_index: 35
  hexagram_name_cn: 晋
  line_index: 5
  text: 悔亡，失得勿恤，往吉，无不利。
  commentary: "《象》曰：失得勿恤，往有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_35_line_6
  king_wen_index: 35
  hexagram_name_cn: 晋
  line_index: 6
  text: 晋其角，维用伐邑，厉吉无咎，贞吝。
  commentary: "《象》曰：维用伐邑，道未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_36_line_1
  king_wen_index: 36
  hexagram_name_cn: 明夷
  line_index: 1
  text: 明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。
  commentary: "《象》曰：君子于行，义不食也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_36_line_2
  king_wen_index: 36
  hexagram_name_cn: 明夷
  line_index: 2
  text: 明夷，夷于左股，用拯马壮，吉。
  commentary: "《象》曰：六二之吉，顺以则也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_36_line_3
  king_wen_index: 36
  hexagram_name_cn: 明夷
  line_index: 3
  text: 明夷于南狩，得其大首，不可疾贞。
  commentary: "《象》曰：南狩之志，乃大得也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_36_line_4
  king_wen_index: 36
  hexagram_name_cn: 明夷
  line_index: 4
  text: 入于左腹，获明夷之心，出于门庭。
  commentary: "《象》曰：入于左腹，获心意也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_36_line_5
  king_wen_index: 36
  hexagram_name_cn: 明夷
  line_index: 5
  text: 箕子之明夷，利贞。
  commentary: "《象》曰：箕子之贞，明不可息也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_36_line_6
  king_wen_index: 36
  hexagram_name_cn: 明夷
  line_index: 6
  text: 不明晦，初登于天，后入于地。
  commentary: "《象》曰：初登于天，照四国也。后入于地，失则也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_37_line_1
  king_wen_index: 37
  hexagram_name_cn: 家人
  line_index: 1
  text: 闲有家，悔亡。
  commentary: "《象》曰：闲有家，志未变也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_37_line_2
  king_wen_index: 37
  hexagram_name_cn: 家人
  line_index: 2
  text: 无攸遂，在中馈，贞吉。
  commentary: "《象》曰：六二之吉，顺以巽也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_37_line_3
  king_wen_index: 37
  hexagram_name_cn: 家人
  line_index: 3
  text: 家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。
  commentary: "《象》曰：家人嗃嗃，未失也；妇子嘻嘻，失家节也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_37_line_4
  king_wen_index: 37
  hexagram_name_cn: 家人
  line_index: 4
  text: 富家，大吉。
  commentary: "《象》曰：富家大吉，顺在位也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_37_line_5
  king_wen_index: 37
  hexagram_name_cn: 家人
  line_index: 5
  text: 王假有家，勿恤，往吉。
  commentary: "《象》曰：王假有家，交相爱也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_37_line_6
  king_wen_index: 37
  hexagram_name_cn: 家人
  line_index: 6
  text: 有孚威如，终吉。
  commentary: "《象》曰：威如之吉，反身之谓也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_38_line_1
  king_wen_index: 38
  hexagram_name_cn: 睽
  line_index: 1
  text: 悔亡，丧马勿逐，自复；见恶人无咎。
  commentary: "《象》曰：见恶人，以辟咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_38_line_2
  king_wen_index: 38
  hexagram_name_cn: 睽
  line_index: 2
  text: 遇主于巷，无咎。
  commentary: "《象》曰：遇主于巷，未失道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_38_line_3
  king_wen_index: 38
  hexagram_name_cn: 睽
  line_index: 3
  text: 见舆曳，其牛掣，其人天且劓，无初有终。
  commentary: "《象》曰：见舆曳，位不当也。无初有终，遇刚也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_38_line_4
  king_wen_index: 38
  hexagram_name_cn: 睽
  line_index: 4
  text: 睽孤，遇元夫，交孚，厉无咎。
  commentary: "《象》曰：交孚无咎，志行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_38_line_5
  king_wen_index: 38
  hexagram_name_cn: 睽
  line_index: 5
  text: 悔亡，厥宗噬肤，往何咎。
  commentary: "《象》曰：厥宗噬肤，往有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_38_line_6
  king_wen_index: 38
  hexagram_name_cn: 睽
  line_index: 6
  text: 睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。
  commentary: "《象》曰：遇雨之吉，群疑亡也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_39_line_1
  king_wen_index: 39
  hexagram_name_cn: 蹇
  line_index: 1
  text: 往蹇，来誉。
  commentary: "《象》曰：往蹇来誉，宜待也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_39_line_2
  king_wen_index: 39
  hexagram_name_cn: 蹇
  line_index: 2
  text: 王臣蹇蹇，匪躬之故。
  commentary: "《象》曰：王臣蹇蹇，终无尤也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_39_line_3
  king_wen_index: 39
  hexagram_name_cn: 蹇
  line_index: 3
  text: 往蹇来反。
  commentary: "《象》曰：往蹇来反，内喜之也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_39_line_4
  king_wen_index: 39
  hexagram_name_cn: 蹇
  line_index: 4
  text: 往蹇来连。
  commentary: "《象》曰：往蹇来连，当位实也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_39_line_5
  king_wen_index: 39
  hexagram_name_cn: 蹇
  line_index: 5
  text: 大蹇朋来。
  commentary: "《象》曰：大蹇朋来，以中节也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_39_line_6
  king_wen_index: 39
  hexagram_name_cn: 蹇
  line_index: 6
  text: 往蹇来硕，吉；利见大人。
  commentary: "《象》曰：往蹇来硕，志在内也。利见大人，以从贵也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_40_line_1
  king_wen_index: 40
  hexagram_name_cn: 解
  line_index: 1
  text: 无咎。
  commentary: "《象》曰：刚柔之际，义无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_40_line_2
  king_wen_index: 40
  hexagram_name_cn: 解
  line_index: 2
  text: 田获三狐，得黄矢，贞吉。
  commentary: "《象》曰：九二贞吉，得中道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_40_line_3
  king_wen_index: 40
  hexagram_name_cn: 解
  line_index: 3
  text: 负且乘，致寇至，贞吝。
  commentary: "《象》曰：负且乘，亦可丑也，自我致戎，又谁咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_40_line_4
  king_wen_index: 40
  hexagram_name_cn: 解
  line_index: 4
  text: 解而拇，朋至斯孚。
  commentary: "《象》曰：解而拇，未当位也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_40_line_5
  king_wen_index: 40
  hexagram_name_cn: 解
  line_index: 5
  text: 君子维有解，吉；有孚于小人。
  commentary: "《象》曰：君子有解，小人退也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_40_line_6
  king_wen_index: 40
  hexagram_name_cn: 解
  line_index: 6
  text: 公用射隼于高墉之上，获之，无不利。
  commentary: "《象》曰：公用射隼，以解悖也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_41_line_1
  king_wen_index: 41
  hexagram_name_cn: 损
  line_index: 1
  text: 巳事遄往，无咎，酌损之。
  commentary: "《象》曰：巳事遄往，尚合志也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_41_line_2
  king_wen_index: 41
  hexagram_name_cn: 损
  line_index: 2
  text: 利贞，征凶，弗损，益之。
  commentary: "《象》曰：九二利贞，中以为志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_41_line_3
  king_wen_index: 41
  hexagram_name_cn: 损
  line_index: 3
  text: 三人行，则损一人；一人行，则得其友。
  commentary: "《象》曰：一人行，三则疑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_41_line_4
  king_wen_index: 41
  hexagram_name_cn: 损
  line_index: 4
  text: 损其疾，使遄有喜，无咎。
  commentary: "《象》曰：损其疾，亦可喜也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_41_line_5
  king_wen_index: 41
  hexagram_name_cn: 损
  line_index: 5
  text: 或益之，十朋之龟弗克违，元吉。
  commentary: "《象》曰：六五元吉，自上佑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_41_line_6
  king_wen_index: 41
  hexagram_name_cn: 损
  line_index: 6
  text: 弗损益之，无咎，贞吉，有攸往，得臣无家。
  commentary: "《象》曰：弗损益之，大得志也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_42_line_1
  king_wen_index: 42
  hexagram_name_cn: 益
  line_index: 1
  text: 利用为大作，元吉，无咎。
  commentary: "《象》曰：元吉无咎，下不厚事也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_42_line_2
  king_wen_index: 42
  hexagram_name_cn: 益
  line_index: 2
  text: 或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。
  commentary: "《象》曰：或益之，自外来也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_42_line_3
  king_wen_index: 42
  hexagram_name_cn: 益
  line_index: 3
  text: 益之用凶事，无咎。有孚中行，告公用圭。
  commentary: "《象》曰：益用凶事，固有之也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_42_line_4
  king_wen_index: 42
  hexagram_name_cn: 益
  line_index: 4
  text: 中行，告公从。利用为依迁国。
  commentary: "《象》曰：告公从，以益志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_42_line_5
  king_wen_index: 42
  hexagram_name_cn: 益
  line_index: 5
  text: 有孚惠心，勿问元吉。有孚惠我德。
  commentary: "《象》曰：有孚惠心，勿问之矣。惠我德，大得志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_42_line_6
  king_wen_index: 42
  hexagram_name_cn: 益
  line_index: 6
  text: 莫益之，或击之，立心勿恒，凶。
  commentary: "《象》曰：莫益之，偏辞也。或击之，自外来也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_43_line_1
  king_wen_index: 43
  hexagram_name_cn: 夬
  line_index: 1
  text: 壮于前趾，往不胜为咎。
  commentary: "《象》曰：不胜而往，咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_43_line_2
  king_wen_index: 43
  hexagram_name_cn: 夬
  line_index: 2
  text: 惕号，莫夜有戎，勿恤。
  commentary: "《象》曰：莫夜有戎，得中道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_43_line_3
  king_wen_index: 43
  hexagram_name_cn: 夬
  line_index: 3
  text: 壮于頄，有凶。君子夬夬，独行，遇雨，若濡，有愠，无咎。
  commentary: "《象》曰：君子夬夬，终无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_43_line_4
  king_wen_index: 43
  hexagram_name_cn: 夬
  line_index: 4
  text: 臀无肤，其行次且。牵羊悔亡，闻言不信。
  commentary: "《象》曰：其行次且，位不当也。闻言不信，聪不明也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_43_line_5
  king_wen_index: 43
  hexagram_name_cn: 夬
  line_index: 5
  text: 苋陆夬夬，中行无咎。
  commentary: "《象》曰：中行无咎，中未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_43_line_6
  king_wen_index: 43
  hexagram_name_cn: 夬
  line_index: 6
  text: 无号，终有凶。
  commentary: "《象》曰：无号之凶，终不可长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_44_line_1
  king_wen_index: 44
  hexagram_name_cn: 姤
  line_index: 1
  text: 系于金柅，贞吉，有攸往，见凶，羸豕孚踟躅。
  commentary: "《象》曰：系于金柅，柔道牵也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_44_line_2
  king_wen_index: 44
  hexagram_name_cn: 姤
  line_index: 2
  text: 包有鱼，无咎，不利宾。
  commentary: "《象》曰：包有鱼，义不及宾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_44_line_3
  king_wen_index: 44
  hexagram_name_cn: 姤
  line_index: 3
  text: 臀无肤，其行次且，厉，无大咎。
  commentary: "《象》曰：其行次且，行未牵也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_44_line_4
  king_wen_index: 44
  hexagram_name_cn: 姤
  line_index: 4
  text: 包无鱼，起凶。
  commentary: "《象》曰：无鱼之凶，远民也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_44_line_5
  king_wen_index: 44
  hexagram_name_cn: 姤
  line_index: 5
  text: 以杞包瓜，含章，有陨自天。
  commentary: "《象》曰：九五含章，中正也。有陨自天，志不舍命也。"
  source_status: reviewed_variant
  resolution: objective_copy_defect_corrected_from_check_source
- id: proto_hex_44_line_6
  king_wen_index: 44
  hexagram_name_cn: 姤
  line_index: 6
  text: 姤其角，吝，无咎。
  commentary: "《象》曰：姤其角，上穷吝也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_45_line_1
  king_wen_index: 45
  hexagram_name_cn: 萃
  line_index: 1
  text: 有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。
  commentary: "《象》曰：乃乱乃萃，其志乱也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_45_line_2
  king_wen_index: 45
  hexagram_name_cn: 萃
  line_index: 2
  text: 引吉，无咎，孚乃利用禴。
  commentary: "《象》曰：引吉无咎，中未变也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_45_line_3
  king_wen_index: 45
  hexagram_name_cn: 萃
  line_index: 3
  text: 萃如，嗟如，无攸利，往无咎，小吝。
  commentary: "《象》曰：往无咎，上巽也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_45_line_4
  king_wen_index: 45
  hexagram_name_cn: 萃
  line_index: 4
  text: 大吉，无咎。
  commentary: "《象》曰：大吉无咎，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_45_line_5
  king_wen_index: 45
  hexagram_name_cn: 萃
  line_index: 5
  text: 萃有位，无咎。匪孚，元永贞，悔亡。
  commentary: "《象》曰：萃有位，志未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_45_line_6
  king_wen_index: 45
  hexagram_name_cn: 萃
  line_index: 6
  text: 赍咨涕洟，无咎。
  commentary: "《象》曰：赍咨涕洟，未安上也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_46_line_1
  king_wen_index: 46
  hexagram_name_cn: 升
  line_index: 1
  text: 允升，大吉。
  commentary: "《象》曰：允升大吉，上合志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_46_line_2
  king_wen_index: 46
  hexagram_name_cn: 升
  line_index: 2
  text: 孚乃利用禴，无咎。
  commentary: "《象》曰：九二之孚，有喜也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_46_line_3
  king_wen_index: 46
  hexagram_name_cn: 升
  line_index: 3
  text: 升虚邑。
  commentary: "《象》曰：升虚邑，无所疑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_46_line_4
  king_wen_index: 46
  hexagram_name_cn: 升
  line_index: 4
  text: 王用亨于岐山，吉无咎。
  commentary: "《象》曰：王用亨于岐山，顺事也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_46_line_5
  king_wen_index: 46
  hexagram_name_cn: 升
  line_index: 5
  text: 贞吉，升阶。
  commentary: "《象》曰：贞吉升阶，大得志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_46_line_6
  king_wen_index: 46
  hexagram_name_cn: 升
  line_index: 6
  text: 冥升，利于不息之贞。
  commentary: "《象》曰：冥升在上，消不富也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_47_line_1
  king_wen_index: 47
  hexagram_name_cn: 困
  line_index: 1
  text: 臀困于株木，入于幽谷，三岁不觌。
  commentary: "《象》曰：入于幽谷，幽不明也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_47_line_2
  king_wen_index: 47
  hexagram_name_cn: 困
  line_index: 2
  text: 困于酒食，朱绂方来，利用享祀，征凶，无咎。
  commentary: "《象》曰：困于酒食，中有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_47_line_3
  king_wen_index: 47
  hexagram_name_cn: 困
  line_index: 3
  text: 困于石，据于蒺藜，入于其宫，不见其妻，凶。
  commentary: "《象》曰：据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_47_line_4
  king_wen_index: 47
  hexagram_name_cn: 困
  line_index: 4
  text: 来徐徐，困于金车，吝，有终。
  commentary: "《象》曰：来徐徐，志在下也。虽不当位，有与也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_47_line_5
  king_wen_index: 47
  hexagram_name_cn: 困
  line_index: 5
  text: 劓刖，困于赤绂，乃徐有说，利用祭祀。
  commentary: "《象》曰：劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_47_line_6
  king_wen_index: 47
  hexagram_name_cn: 困
  line_index: 6
  text: 困于葛藟，于臲卼，曰动悔。有悔，征吉。
  commentary: "《象》曰：困于葛藟，未当也。动悔，有悔吉，行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_48_line_1
  king_wen_index: 48
  hexagram_name_cn: 井
  line_index: 1
  text: 井泥不食，旧井无禽。
  commentary: "《象》曰：井泥不食，下也。旧井无禽，时舍也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_48_line_2
  king_wen_index: 48
  hexagram_name_cn: 井
  line_index: 2
  text: 井谷射鲋，瓮敝漏。
  commentary: "《象》曰：井谷射鲋，无与也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_48_line_3
  king_wen_index: 48
  hexagram_name_cn: 井
  line_index: 3
  text: 井渫不食，为我心恻，可用汲，王明，并受其福。
  commentary: "《象》曰：井渫不食，行恻也。求王明，受福也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_48_line_4
  king_wen_index: 48
  hexagram_name_cn: 井
  line_index: 4
  text: 井甃，无咎。
  commentary: "《象》曰：井甃无咎，修井也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_48_line_5
  king_wen_index: 48
  hexagram_name_cn: 井
  line_index: 5
  text: 井冽，寒泉食。
  commentary: "《象》曰：寒泉之食，中正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_48_line_6
  king_wen_index: 48
  hexagram_name_cn: 井
  line_index: 6
  text: 井收勿幕，有孚元吉。
  commentary: "《象》曰：元吉在上，大成也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_49_line_1
  king_wen_index: 49
  hexagram_name_cn: 革
  line_index: 1
  text: 巩用黄牛之革。
  commentary: "《象》曰：巩用黄牛，不可以有为也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_49_line_2
  king_wen_index: 49
  hexagram_name_cn: 革
  line_index: 2
  text: 巳日乃革之，征吉，无咎。
  commentary: "《象》曰：巳日革之，行有嘉也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_49_line_3
  king_wen_index: 49
  hexagram_name_cn: 革
  line_index: 3
  text: 征凶，贞厉，革言三就，有孚。
  commentary: "《象》曰：革言三就，又何之矣。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_49_line_4
  king_wen_index: 49
  hexagram_name_cn: 革
  line_index: 4
  text: 悔亡，有孚改命，吉。
  commentary: "《象》曰：改命之吉，信志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_49_line_5
  king_wen_index: 49
  hexagram_name_cn: 革
  line_index: 5
  text: 大人虎变，未占有孚。
  commentary: "《象》曰：大人虎变，其文炳也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_49_line_6
  king_wen_index: 49
  hexagram_name_cn: 革
  line_index: 6
  text: 君子豹变，小人革面，征凶，居贞吉。
  commentary: "《象》曰：君子豹变，其文蔚也。小人革面，顺以从君也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_50_line_1
  king_wen_index: 50
  hexagram_name_cn: 鼎
  line_index: 1
  text: 鼎颠趾，利出否，得妾以其子，无咎。
  commentary: "《象》曰：鼎颠趾，未悖也。利出否，以从贵也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_50_line_2
  king_wen_index: 50
  hexagram_name_cn: 鼎
  line_index: 2
  text: 鼎有实，我仇有疾，不我能即，吉。
  commentary: "《象》曰：鼎有实，慎所之也。我仇有疾，终无尤也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_50_line_3
  king_wen_index: 50
  hexagram_name_cn: 鼎
  line_index: 3
  text: 鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。
  commentary: "《象》曰：鼎耳革，失其义也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_50_line_4
  king_wen_index: 50
  hexagram_name_cn: 鼎
  line_index: 4
  text: 鼎折足，覆公餗，其形渥，凶。
  commentary: "《象》曰：覆公餗，信如何也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_50_line_5
  king_wen_index: 50
  hexagram_name_cn: 鼎
  line_index: 5
  text: 鼎黄耳，金铉，利贞。
  commentary: "《象》曰：鼎黄耳，中以为实也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_50_line_6
  king_wen_index: 50
  hexagram_name_cn: 鼎
  line_index: 6
  text: 鼎玉铉，大吉，无不利。
  commentary: "《象》曰：玉铉在上，刚柔节也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_51_line_1
  king_wen_index: 51
  hexagram_name_cn: 震
  line_index: 1
  text: 震来虩虩，后笑言哑哑，吉。
  commentary: "《象》曰：震来虩虩，恐致福也。笑言哑哑，后有则也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_51_line_2
  king_wen_index: 51
  hexagram_name_cn: 震
  line_index: 2
  text: 震来厉，亿丧贝，跻于九陵，勿逐，七日得。
  commentary: "《象》曰：震来厉，乘刚也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_51_line_3
  king_wen_index: 51
  hexagram_name_cn: 震
  line_index: 3
  text: 震苏苏，震行无眚。
  commentary: "《象》曰：震苏苏，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_51_line_4
  king_wen_index: 51
  hexagram_name_cn: 震
  line_index: 4
  text: 震遂泥。
  commentary: "《象》曰：震遂泥，未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_51_line_5
  king_wen_index: 51
  hexagram_name_cn: 震
  line_index: 5
  text: 震往来厉，亿无丧，有事。
  commentary: "《象》曰：震往来厉，危行也。其事在中，大无丧也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_51_line_6
  king_wen_index: 51
  hexagram_name_cn: 震
  line_index: 6
  text: 震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。
  commentary: "《象》曰：震索索，中未得也。虽凶无咎，畏邻戒也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_52_line_1
  king_wen_index: 52
  hexagram_name_cn: 艮
  line_index: 1
  text: 艮其趾，无咎，利永贞。
  commentary: "《象》曰：艮其趾，未失正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_52_line_2
  king_wen_index: 52
  hexagram_name_cn: 艮
  line_index: 2
  text: 艮其腓，不拯其随，其心不快。
  commentary: "《象》曰：不拯其随，未退听也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_52_line_3
  king_wen_index: 52
  hexagram_name_cn: 艮
  line_index: 3
  text: 艮其限，列其夤，厉薰心。
  commentary: "《象》曰：艮其限，危薰心也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_52_line_4
  king_wen_index: 52
  hexagram_name_cn: 艮
  line_index: 4
  text: 艮其身，无咎。
  commentary: "《象》曰：艮其身，止诸躬也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_52_line_5
  king_wen_index: 52
  hexagram_name_cn: 艮
  line_index: 5
  text: 艮其辅，言有序，悔亡。
  commentary: "《象》曰：艮其辅，以中正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_52_line_6
  king_wen_index: 52
  hexagram_name_cn: 艮
  line_index: 6
  text: 敦艮，吉。
  commentary: "《象》曰：敦艮之吉，以厚终也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_53_line_1
  king_wen_index: 53
  hexagram_name_cn: 渐
  line_index: 1
  text: 鸿渐于干，小子厉，有言，无咎。
  commentary: "《象》曰：小子之厉，义无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_53_line_2
  king_wen_index: 53
  hexagram_name_cn: 渐
  line_index: 2
  text: 鸿渐于磐，饮食衎衎，吉。
  commentary: "《象》曰：饮食衎衎，吉，不素饱也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_53_line_3
  king_wen_index: 53
  hexagram_name_cn: 渐
  line_index: 3
  text: 鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。
  commentary: "《象》曰：夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_53_line_4
  king_wen_index: 53
  hexagram_name_cn: 渐
  line_index: 4
  text: 鸿渐于木，或得其桷，无咎。
  commentary: "《象》曰：或得其桷，顺以巽也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_53_line_5
  king_wen_index: 53
  hexagram_name_cn: 渐
  line_index: 5
  text: 鸿渐于陵，妇三岁不孕，终莫之胜，吉。
  commentary: "《象》曰：终莫之胜，吉；得所愿也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_53_line_6
  king_wen_index: 53
  hexagram_name_cn: 渐
  line_index: 6
  text: 鸿渐于陆，其羽可用为仪，吉。
  commentary: "《象》曰：其羽可用为仪，吉；不可乱也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_54_line_1
  king_wen_index: 54
  hexagram_name_cn: 归妹
  line_index: 1
  text: 归妹以娣，跛能履，征吉。
  commentary: "《象》曰：归妹以娣，以恒也。跛能履吉，相承也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_54_line_2
  king_wen_index: 54
  hexagram_name_cn: 归妹
  line_index: 2
  text: 眇能视，利幽人之贞。
  commentary: "《象》曰：利幽人之贞，未变常也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_54_line_3
  king_wen_index: 54
  hexagram_name_cn: 归妹
  line_index: 3
  text: 归妹以须，反归以娣。
  commentary: "《象》曰：归妹以须，未当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_54_line_4
  king_wen_index: 54
  hexagram_name_cn: 归妹
  line_index: 4
  text: 归妹愆期，迟归有时。
  commentary: "《象》曰：愆期之志，有待而行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_54_line_5
  king_wen_index: 54
  hexagram_name_cn: 归妹
  line_index: 5
  text: 帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。
  commentary: "《象》曰：帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_54_line_6
  king_wen_index: 54
  hexagram_name_cn: 归妹
  line_index: 6
  text: 女承筐无实，士刲羊无血，无攸利。
  commentary: "《象》曰：上六无实，承虚筐也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_55_line_1
  king_wen_index: 55
  hexagram_name_cn: 丰
  line_index: 1
  text: 遇其配主，虽旬无咎，往有尚。
  commentary: "《象》曰：虽旬无咎，过旬灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_55_line_2
  king_wen_index: 55
  hexagram_name_cn: 丰
  line_index: 2
  text: 丰其蔀，日中见斗，往得疑疾，有孚发若，吉。
  commentary: "《象》曰：有孚发若，信以发志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_55_line_3
  king_wen_index: 55
  hexagram_name_cn: 丰
  line_index: 3
  text: 丰其沛，日中见沫，折其右肱，无咎。
  commentary: "《象》曰：丰其沛，不可大事也。折其右肱，终不可用也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_55_line_4
  king_wen_index: 55
  hexagram_name_cn: 丰
  line_index: 4
  text: 丰其蔀，日中见斗，遇其夷主，吉。
  commentary: "《象》曰：丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_55_line_5
  king_wen_index: 55
  hexagram_name_cn: 丰
  line_index: 5
  text: 来章，有庆誉，吉。
  commentary: "《象》曰：六五之吉，有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_55_line_6
  king_wen_index: 55
  hexagram_name_cn: 丰
  line_index: 6
  text: 丰其屋，蔀其家，闚其户，阒其无人，三岁不觌，凶。
  commentary: "《象》曰：丰其屋，天际翔也。闚其户，阒其无人，自藏也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_56_line_1
  king_wen_index: 56
  hexagram_name_cn: 旅
  line_index: 1
  text: 旅琐琐，斯其所取灾。
  commentary: "《象》曰：旅琐琐，志穷灾也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_56_line_2
  king_wen_index: 56
  hexagram_name_cn: 旅
  line_index: 2
  text: 旅即次，怀其资，得童仆贞。
  commentary: "《象》曰：得童仆贞，终无尤也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_56_line_3
  king_wen_index: 56
  hexagram_name_cn: 旅
  line_index: 3
  text: 旅焚其次，丧其童仆，贞厉。
  commentary: "《象》曰：旅焚其次，亦以伤矣。以旅与下，其义丧也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_56_line_4
  king_wen_index: 56
  hexagram_name_cn: 旅
  line_index: 4
  text: 旅于处，得其资斧，我心不快。
  commentary: "《象》曰：旅于处，未得位也。得其资斧，心未快也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_56_line_5
  king_wen_index: 56
  hexagram_name_cn: 旅
  line_index: 5
  text: 射雉一矢亡，终以誉命。
  commentary: "《象》曰：终以誉命，上逮也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_56_line_6
  king_wen_index: 56
  hexagram_name_cn: 旅
  line_index: 6
  text: 鸟焚其巢，旅人先笑后号啕。丧牛于易，凶。
  commentary: "《象》曰：以旅在上，其义焚也。丧牛于易，终莫之闻也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_57_line_1
  king_wen_index: 57
  hexagram_name_cn: 巽
  line_index: 1
  text: 进退，利武人之贞。
  commentary: "《象》曰：进退，志疑也。利武人之贞，志治也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_57_line_2
  king_wen_index: 57
  hexagram_name_cn: 巽
  line_index: 2
  text: 巽在床下，用史巫纷若，吉，无咎。
  commentary: "《象》曰：纷若之吉，得中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_57_line_3
  king_wen_index: 57
  hexagram_name_cn: 巽
  line_index: 3
  text: 频巽，吝。
  commentary: "《象》曰：频巽之吝，志穷也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_57_line_4
  king_wen_index: 57
  hexagram_name_cn: 巽
  line_index: 4
  text: 悔亡，田获三品。
  commentary: "《象》曰：田获三品，有功也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_57_line_5
  king_wen_index: 57
  hexagram_name_cn: 巽
  line_index: 5
  text: 贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。
  commentary: "《象》曰：九五之吉，位正中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_57_line_6
  king_wen_index: 57
  hexagram_name_cn: 巽
  line_index: 6
  text: 巽在床下，丧其资斧，贞凶。
  commentary: "《象》曰：巽在床下，上穷也。丧其资斧，正乎凶也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_58_line_1
  king_wen_index: 58
  hexagram_name_cn: 兑
  line_index: 1
  text: 和兑，吉。
  commentary: "《象》曰：和兑之吉，行未疑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_58_line_2
  king_wen_index: 58
  hexagram_name_cn: 兑
  line_index: 2
  text: 孚兑，吉，悔亡。
  commentary: "《象》曰：孚兑之吉，信志也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_58_line_3
  king_wen_index: 58
  hexagram_name_cn: 兑
  line_index: 3
  text: 来兑，凶。
  commentary: "《象》曰：来兑之凶，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_58_line_4
  king_wen_index: 58
  hexagram_name_cn: 兑
  line_index: 4
  text: 商兑，未宁，介疾有喜。
  commentary: "《象》曰：九四之喜，有庆也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_58_line_5
  king_wen_index: 58
  hexagram_name_cn: 兑
  line_index: 5
  text: 孚于剥，有厉。
  commentary: "《象》曰：孚于剥，位正当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_58_line_6
  king_wen_index: 58
  hexagram_name_cn: 兑
  line_index: 6
  text: 引兑。
  commentary: "《象》曰：上六引兑，未光也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_59_line_1
  king_wen_index: 59
  hexagram_name_cn: 涣
  line_index: 1
  text: 用拯马壮，吉。
  commentary: "《象》曰：初六之吉，顺也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_59_line_2
  king_wen_index: 59
  hexagram_name_cn: 涣
  line_index: 2
  text: 涣奔其机，悔亡。
  commentary: "《象》曰：涣奔其机，得愿也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_59_line_3
  king_wen_index: 59
  hexagram_name_cn: 涣
  line_index: 3
  text: 涣其躬，无悔。
  commentary: "《象》曰：涣其躬，志在外也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_59_line_4
  king_wen_index: 59
  hexagram_name_cn: 涣
  line_index: 4
  text: 涣其群，元吉。涣有丘，匪夷所思。
  commentary: "《象》曰：涣其群，元吉；光大也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_59_line_5
  king_wen_index: 59
  hexagram_name_cn: 涣
  line_index: 5
  text: 涣汗其大号，涣王居，无咎。
  commentary: "《象》曰：王居无咎，正位也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_59_line_6
  king_wen_index: 59
  hexagram_name_cn: 涣
  line_index: 6
  text: 涣其血，去逖出，无咎。
  commentary: "《象》曰：涣其血，远害也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_60_line_1
  king_wen_index: 60
  hexagram_name_cn: 节
  line_index: 1
  text: 不出户庭，无咎。
  commentary: "《象》曰：不出户庭，知通塞也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_60_line_2
  king_wen_index: 60
  hexagram_name_cn: 节
  line_index: 2
  text: 不出门庭，凶。
  commentary: "《象》曰：不出门庭，失时极也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_60_line_3
  king_wen_index: 60
  hexagram_name_cn: 节
  line_index: 3
  text: 不节若，则嗟若，无咎。
  commentary: "《象》曰：不节之嗟，又谁咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_60_line_4
  king_wen_index: 60
  hexagram_name_cn: 节
  line_index: 4
  text: 安节，亨。
  commentary: "《象》曰：安节之亨，承上道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_60_line_5
  king_wen_index: 60
  hexagram_name_cn: 节
  line_index: 5
  text: 甘节，吉；往有尚。
  commentary: "《象》曰：甘节之吉，居位中也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_60_line_6
  king_wen_index: 60
  hexagram_name_cn: 节
  line_index: 6
  text: 苦节，贞凶，悔亡。
  commentary: "《象》曰：苦节贞凶，其道穷也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_61_line_1
  king_wen_index: 61
  hexagram_name_cn: 中孚
  line_index: 1
  text: 虞吉，有它不燕。
  commentary: "《象》曰：初九虞吉，志未变也。"
  source_status: reviewed_variant
  resolution: primary_simplified_edition_retained
- id: proto_hex_61_line_2
  king_wen_index: 61
  hexagram_name_cn: 中孚
  line_index: 2
  text: 鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。
  commentary: "《象》曰：其子和之，中心愿也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_61_line_3
  king_wen_index: 61
  hexagram_name_cn: 中孚
  line_index: 3
  text: 得敌，或鼓或罢，或泣或歌。
  commentary: "《象》曰：可鼓或罢，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_61_line_4
  king_wen_index: 61
  hexagram_name_cn: 中孚
  line_index: 4
  text: 月几望，马匹亡，无咎。
  commentary: "《象》曰：马匹亡，绝类上也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_61_line_5
  king_wen_index: 61
  hexagram_name_cn: 中孚
  line_index: 5
  text: 有孚挛如，无咎。
  commentary: "《象》曰：有孚挛如，位正当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_61_line_6
  king_wen_index: 61
  hexagram_name_cn: 中孚
  line_index: 6
  text: 翰音登于天，贞凶。
  commentary: "《象》曰：翰音登于天，何可长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_62_line_1
  king_wen_index: 62
  hexagram_name_cn: 小过
  line_index: 1
  text: 飞鸟以凶。
  commentary: "《象》曰：飞鸟以凶，不可如何也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_62_line_2
  king_wen_index: 62
  hexagram_name_cn: 小过
  line_index: 2
  text: 过其祖，遇其妣；不及其君，遇其臣；无咎。
  commentary: "《象》曰：不及其君，臣不可过也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_62_line_3
  king_wen_index: 62
  hexagram_name_cn: 小过
  line_index: 3
  text: 弗过防之，从或戕之，凶。
  commentary: "《象》曰：从或戕之，凶如何也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_62_line_4
  king_wen_index: 62
  hexagram_name_cn: 小过
  line_index: 4
  text: 无咎，弗过遇之。往厉必戒，勿用永贞。
  commentary: "《象》曰：弗过遇之，位不当也。往厉必戒，终不可长也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_62_line_5
  king_wen_index: 62
  hexagram_name_cn: 小过
  line_index: 5
  text: 密云不雨，自我西郊，公弋取彼在穴。
  commentary: "《象》曰：密云不雨，已上也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_62_line_6
  king_wen_index: 62
  hexagram_name_cn: 小过
  line_index: 6
  text: 弗遇过之，飞鸟离之，凶，是谓灾眚。
  commentary: "《象》曰：弗遇过之，已亢也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_63_line_1
  king_wen_index: 63
  hexagram_name_cn: 既济
  line_index: 1
  text: 曳其轮，濡其尾，无咎。
  commentary: "《象》曰：曳其轮，义无咎也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_63_line_2
  king_wen_index: 63
  hexagram_name_cn: 既济
  line_index: 2
  text: 妇丧其茀，勿逐，七日得。
  commentary: "《象》曰：七日得，以中道也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_63_line_3
  king_wen_index: 63
  hexagram_name_cn: 既济
  line_index: 3
  text: 高宗伐鬼方，三年克之，小人勿用。
  commentary: "《象》曰：三年克之，惫也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_63_line_4
  king_wen_index: 63
  hexagram_name_cn: 既济
  line_index: 4
  text: 繻有衣袽，终日戒。
  commentary: "《象》曰：终日戒，有所疑也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_63_line_5
  king_wen_index: 63
  hexagram_name_cn: 既济
  line_index: 5
  text: 东邻杀牛，不如西邻之禴祭，实受其福。
  commentary: "《象》曰：东邻杀牛，不如西邻之时也；实受其福，吉大来也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_63_line_6
  king_wen_index: 63
  hexagram_name_cn: 既济
  line_index: 6
  text: 濡其首，厉。
  commentary: "《象》曰：濡其首厉，何可久也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_64_line_1
  king_wen_index: 64
  hexagram_name_cn: 未济
  line_index: 1
  text: 濡其尾，吝。
  commentary: "《象》曰：濡其尾，亦不知极也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_64_line_2
  king_wen_index: 64
  hexagram_name_cn: 未济
  line_index: 2
  text: 曳其轮，贞吉。
  commentary: "《象》曰：九二贞吉，中以行正也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_64_line_3
  king_wen_index: 64
  hexagram_name_cn: 未济
  line_index: 3
  text: 未济，征凶，利涉大川。
  commentary: "《象》曰：未济征凶，位不当也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_64_line_4
  king_wen_index: 64
  hexagram_name_cn: 未济
  line_index: 4
  text: 贞吉，悔亡，震用伐鬼方，三年有赏于大国。
  commentary: "《象》曰：贞吉悔亡，志行也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_64_line_5
  king_wen_index: 64
  hexagram_name_cn: 未济
  line_index: 5
  text: 贞吉，无悔，君子之光，有孚，吉。
  commentary: "《象》曰：君子之光，其晖吉也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
- id: proto_hex_64_line_6
  king_wen_index: 64
  hexagram_name_cn: 未济
  line_index: 6
  text: 有孚于饮酒，无咎，濡其首，有孚失是。
  commentary: "《象》曰：饮酒濡首，亦不知节也。"
  source_status: dual_source_normalized_agreement
  resolution: sources_agree_after_simplification_and_punctuation_normalization
