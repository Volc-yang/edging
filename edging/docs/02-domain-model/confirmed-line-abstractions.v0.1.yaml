    planetary_natural: 多年生植物在风旱冲击中依靠既有根系和储备维持生存，暂缓向新区域扩张。
    social_organizational: 权责争议期间，团队按已有授权继续公共服务并完整记账，不借应急状态永久扩权。
    individual: 职业争议中个人依据原合同完成必要职责、保留记录，但不把临时代理职责直接视为永久所有。
