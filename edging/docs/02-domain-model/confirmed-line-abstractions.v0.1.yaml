  fixed_pattern: 旅卦下艮止足、上离明界，初六处临时处境入口，阴居阳位失正却与九四正应；自身行动力弱但有外层资源接口，若不先稳住基本边界，容易用琐碎行为消耗关系
  variable_pattern: 旅途中沉迷琐碎占取会把志向逼窄并引来风险；六变阳时旅变离，最低点取得主动明性，下艮转离，临时环境进入双重可见与依附
  short_definition: 初到陌生环境先处理安全、身份、住所、规则和核心任务，不用小便宜、过度试探或无意义争执消耗信用。
  semantic_anchor: 旅之初点、志被琐困、信用耗散、明后成离
  stable_path: 少阴8保持初六，在失正位置若只利用九四接口获取细碎利益，会把临时关系推向风险。
  changing_path: 太阴6由阴转阳，旅变离；最低承载转为主动辨明，系统进入高度可见、彼此依赖的临时结构。
  principle: 临时处境的首要资源是方向和信用；细碎占取的收益通常小于它对信任与安全的消耗。
  scale_anchors:
    cosmic_max: 航天节点初入临时编队时先确认安全协议和任务，不为少量带宽反复争用，避免损耗编队信用。
    planetary_natural: 外来救援或治理团队初到地方先遵守安全、社区和资源规则，不以小规模占取破坏信任。
    social_organizational: 新人、顾问或临时团队先理解权限与核心任务，不靠报销漏洞、信息试探和琐碎争执获利。
    individual: 旅行或进入新环境时先安顿安全、证件、住所和目标，不因小便宜或琐事失去判断。
    biological: 短暂停留的细胞先建立安全黏附和任务信号，不为局部微量资源扰乱宿主关系。
    microscopic_min: 临时节点接入时先完成认证和核心任务，不为少量资源反复抢锁。
  scale_mapping: 各尺度都由临时环境最低入口、有限信用、细碎占取、方向收窄和主动辨明后高度可见组成；空间在初爻。
  scale_boundary: 基本生存需求不是“琐取”；处于贫困、流离或资源不足者应获得无条件基本保障，不能以礼仪要求压制合理权益。
  review:
    status: confirmed
    notes: 预备草案；旅初六变离；须按卦序审核；草案全量审核确认（2026-07-15）
