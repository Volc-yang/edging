  state_name: 过高失遇
  core_abstraction: 局部动作走到最高终端后，若继续越过本应相遇的接口，系统会像飞行单元脱离可联系空域一样失去支撑、反馈和回返，形成可预见灾害
  fixed_pattern: 上六处上震终端，阴居阴位得正并与九三正应；它本有边界防护连接，却处于最高快速端，若越过相遇窗口，真实对应也无法继续追随
  variable_pattern: 不在接口相遇而继续越过，飞行单元最终离群，结构凶险；六变阳时小过变旅，终端取得主动明性，上震转离，失联单元进入临时、无固定归属的旅状态
  short_definition: 为高处、小尺度动作设置最高高度、通信和回返线；一旦错过对接窗口，立即降级、定位和寻找临时安全落点。
  semantic_anchor: 最高快端、越过相遇、飞离失联、失后成旅
  stable_path: 少阴8保持上六，虽与九三正应，若继续越过最高相遇点，便会失去真实连接并造成灾害。
  changing_path: 太阴6由阴转阳，小过变旅；终端获得主动可见性，但已脱离固定系统，只能在临时环境中重新安置。
  principle: 小过允许略过常规，不允许越过通信、支撑和回返的最高边界。
  scale_anchors:
    cosmic_max: 航天节点越过最高对接与通信窗口会失联，应设高度和返航线，错过后寻找临时安全轨位。
    planetary_natural: 高空、山地或远程任务越过天气、通信与补给边界会失援，应及时降级和定位。
    social_organizational: 小型试点越过授权、沟通和支持范围会脱离组织，应停止扩张并重新建立临时治理。
    individual: 冒险、工作或关系试探越过安全联络与回返能力时应立即停止，寻找安全落点和支持。
    biological: 迁移单元越过信号、营养和回返范围后会失联，应降低活动并寻找临时基质。
    microscopic_min: 节点越过租约、心跳和回滚边界后脱网，应进入隔离安全态并重新发现。
  scale_mapping: 各尺度都由最高快速终端、内层真实正应、相遇窗口、继续越界、连接与回返丧失和失联后的临时安置组成；空间在上爻。
  scale_boundary: 失联和事故者应优先获得搜救与支持，不因其可能越界而拒绝救援；责任复盘应在安全恢复之后进行。
