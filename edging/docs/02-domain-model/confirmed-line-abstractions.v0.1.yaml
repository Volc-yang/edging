    planetary_natural: 河流、交通或能源主干不能无过渡骤停，应设置缓冲与分流，防止上下游支撑剥落。
    social_organizational: 关键项目或服务不能在无交接时突然冻结，应降载、通知、转移职责并保障连续性。
    individual: 高强度工作、训练或关系不能仅靠突然僵断解决，应在安全支持下分段退出和释放压力。
    biological: 运动链核心关节突然锁死会使应力伤及脊柱和组织，应渐进制动并分散负荷。
    microscopic_min: 高速数据或机械链不能在中央接口硬锁，应先降频、排空队列和释放储能。
