    planetary_natural: 洪峰退去或生态修复初成时继续限流和监测，容许边缘积水而不贸然全面开放。
    social_organizational: 项目上线或重组完成后冻结扩张，保留观察期、回滚和收尾资源。
    individual: 达成目标或渡过危机后先减速休整，接受少量未尽事项，不立即追逐下一轮。
