  fixed_pattern: 六三处下震出口，阴居阳位失正而不中，却与上九正应；它能直接获得终端供给，但缺少位置与尺度约束，容易把有来源误当作有益
  variable_pattern: 长期坚持与自身结构相悖的摄取方式会使系统不可用而无利；六变阳时颐变贲，摄取边界获得主动表现力，却可能转向包装和形式而非真实养分
  short_definition: 评估输入的成分、剂量、节律和长期后果，不以来源权威、短期快感或漂亮外观证明适配；不合则暂停并重建基本通道。
  semantic_anchor: 供给有源、结构不适、长期失用、形式代养
  stable_path: 少阴8保持六三，若持续承接上九供给却不校验自身适配，养护路径会长期背离功能。
  changing_path: 太阴6由阴转阳，颐变贲；失配摄取转为主动形式建构，若无内容校验，外观会继续替代真正养分。
  principle: 供给是否有益由接收系统的长期功能决定，不由供给者强大或输入显著决定。
  scale_anchors:
