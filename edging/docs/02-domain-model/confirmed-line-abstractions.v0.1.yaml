    planetary_natural: 野外多种足迹、水迹与侵蚀纹理交错时，调查者按时间和来源辨认，不凭显眼痕迹定路。
    social_organizational: 事件初期日志、传言和指标交错时，团队逐条标注来源与置信度，再决定行动。
    individual: 面对关系或事件的多个早期信号时，个人放慢判断，核对情境和顺序，不把第一印象当全貌。
    biological: 细胞在多种初始信号重叠时通过时序和受体组合辨别来源，避免错误响应。
    microscopic_min: 传感器检测到重叠谱峰时先分离背景与信号，再把峰位映射到具体成分。
  scale_mapping: 各尺度都由初始可见痕迹、多源重叠、分步鉴别和失去固定基底后的移动组成；空间在最低识别入口，时间在信息刚显现时。
  scale_boundary: 敬慎不是无限拖延；当安全阈值已明确或延迟本身有害时，应依据当前最佳证据采取可逆行动。
