  state_name: 缠顶决行
  core_abstraction: 受困发展到最高终端时，外部缠绕与内部对行动后悔的预判会共同制造不稳定；承认当前路径已经有悔，并作出可审查的移动，才可能离开困局
  fixed_pattern: 上六处上兑终端，阴居阴位得正却与六三同阴不应；它能感知并表达缠绕状态，但缺少跨层互补，容易在最高边缘因每个动作都可能后悔而停滞
  variable_pattern: 被藤蔓般关系缠绕且立足不稳，若只说行动会后悔便继续受困；承认已有问题并前往可吉，六变阳时困变讼，终端主动化后，含混纠缠转为明确权责争议
  short_definition: 列出让行动停滞的外部绑定和预期损失，承认维持现状也有代价，选择最小可逆步骤离开；随后通过证据、协商或程序澄清争议。
  semantic_anchor: 终端缠绕、立足不稳、预悔停行、动后成讼
  stable_path: 少阴8保持上六，在无六三正应时既受外部关系缠绕，也被预期后悔束缚；看见现状之悔是行动起点。
  changing_path: 太阴6由阴转阳，困变讼；终端取得主动表达与行动，模糊束缚进入事实、边界和权责的公开澄清。
  principle: 困局终端的关键不是保证行动无悔，而是比较行动与不行动的代价，并用最小可逆步骤恢复选择。
  scale_anchors:
    cosmic_max: 航天节点被多条故障链缠住且姿态不稳时承认现路径不可持续，执行最小脱离机动并记录后续责任争议。
    planetary_natural: 治理项目被合同、利益和生态风险缠绕时公开沉没成本，采取可逆退出步骤，再依法澄清权责。
    social_organizational: 组织被遗留依赖和对失败的恐惧困住时承认现状代价，小步解除绑定，并把冲突带入正式程序。
    individual: 关系或生活选择被多重承诺缠住时，不等待完全无悔，先采取安全、可逆且有支持的一步，再处理边界争议。
    biological: 组织终端被异常基质缠绕且力学不稳时启动受控脱附，随后通过信号重新界定修复边界。
    microscopic_min: 进程被循环依赖锁住时执行可回滚断链，随后由日志和仲裁协议明确资源归属。
  scale_mapping: 各尺度都由最高终端、外部缠绕、立足不稳、预期后悔、最小行动和行动后权责澄清组成；时间是困之终局转折。
  scale_boundary: 行动必须评估安全、法律和照护责任；不能鼓励受暴力控制者独自冒险，应优先建立专业支持、保密计划和紧急保护。
  review:
