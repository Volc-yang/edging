  variable_pattern: 流泪、忧戚与叹息若连接事实和责任，可使中心不因明而骄并趋吉；六变阳时离变同人，内在承受转为公共行动，形成基于共同事实的协作
  short_definition: 治理中心不压制坏消息和正常悲伤，而把所见损失转成承认、修正、补偿和共同参与；情绪不是结论，却可打开责任通道。
  semantic_anchor: 中心见损、情感承载、权力自省、明入同人
  stable_path: 少阴8保持六五，让中心真实承受显现出的损失与责任，不以权力或乐观叙事隔离后果。
  changing_path: 太阴6由阴转阳，离变同人；中心悲戚获得行动力，私人承受转为公开事实、共同修正和协作。
  principle: 明性若不能让中心感受到自身决定的后果，就还没有成为治理知识。
  scale_anchors:
    cosmic_max: 任务中心直面事故遥测和损失，不美化失败，并把哀悼转为公开调查与跨团队修正。
    planetary_natural: 环境治理者面对物种与社区损失时承认代价，推动共同修复，而不只展示总体指标。
    social_organizational: 领导者接收受影响者的真实后果和悲伤，承担责任并开放共同决策。
    individual: 个人看见自己的行为造成伤害时允许愧疚和悲伤进入意识，再以道歉、补偿和改变回应。
    biological: 中枢系统整合疼痛和损伤信号，不完全屏蔽不适，而据此组织全身修复。
    microscopic_min: 控制中心保留误差和故障信号，不用滤波抹去坏数据，并据此协调多个模块校正。
  scale_mapping: 各尺度都由中心位置、全局后果显现、对负面信号的真实承载和协同行动组成；空间在第二重明的中心，时间从看见转为负责。
  scale_boundary: 悲伤本身不能替代事实、补偿和制度改变，也不能强迫受影响者安慰责任中心；责任评价仍以行动与结果为准。
  review:
