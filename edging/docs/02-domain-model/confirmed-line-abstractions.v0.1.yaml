    individual: 亲密关系中不让对方每次情绪决定自己的全部行动，保留朋友、专业支持和回应时间。
    biological: 边界细胞不过度同步单一终端信号，以局部反馈和缓冲保持稳态。
    microscopic_min: 节点不随一个对端的抖动反复启停，使用去抖、配额和本地状态机。
