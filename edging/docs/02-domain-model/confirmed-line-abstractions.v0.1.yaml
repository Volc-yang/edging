  state_name: 越级求养
  core_abstraction: 本层供给接口失配时，若绕过可修复的近端关系，直接向远端高位索取，依赖路径会被倒置并放大风险
  fixed_pattern: 六二居下震之中，阴居阴位得正且居中，却与六五同阴不应；它缺少对应层供给，容易越过近端结构而向上九终端来源求养
  variable_pattern: 逆转常规供给链并远征求养，会离开同类承载而趋凶；六变阳时颐变损，本层获得主动性后，应通过减少过量需求和修复近端交换恢复比例
  short_definition: 先识别本层接口为何失效，减少非必要消耗并重建附近供给；只有近端确实不可用时，才以清楚授权连接远端资源。
  semantic_anchor: 接口失配、越级依赖、远征风险、减需复链
  stable_path: 少阴8保持六二，承认六五接口无应，不以持续越级向远端索取替代本层修复。
  changing_path: 太阴6由阴转阳，颐变损；本层从被动求养转为主动减量，降低需求并重建适配交换。
  principle: 供给不足时，增加索取距离不一定增加养分，往往先增加依赖和传输成本。
  scale_anchors:
    cosmic_max: 轨道节点本地补给接口失效后若越级追逐远端母站，会增加燃料与失联风险；应先减载并修复近端网络。
    planetary_natural: 地区水循环受损后长期跨流域调水会增加生态与能源成本，应同步降耗和修复本地水源。
    social_organizational: 团队绕过失效的日常资源接口，反复向最高层争取特批，会形成脆弱依赖；应先修流程和减负。
    individual: 基本需求未被近端关系或自身计划满足时，持续向遥远权威寻求认可和资源会提高成本，应先恢复可控支持。
    biological: 组织局部供给通道失配时，细胞若持续拉取远端高浓度信号，会破坏梯度；需先降低消耗并修复微循环。
    microscopic_min: 电路局部供电失配时越级拉取远端电源会增加压降与噪声，应先减载并修复邻近稳压。
  scale_mapping: 各尺度都由本层对应失效、跨越多个层级求供、传输与依赖成本上升和减量修复组成；空间路径被倒置，时间上短期补给侵蚀长期自持。
  scale_boundary: 越级求助在紧急危险、近端失灵或权力压制时可能完全必要；不能用层级秩序阻止申诉、救援或获得基本资源。
  review:
    status: confirmed
    notes: 预备草案；颐六二变损；须按卦序审核；草案全量审核确认（2026-07-15）
