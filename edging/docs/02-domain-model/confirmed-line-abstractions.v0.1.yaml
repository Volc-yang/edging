    social_organizational: 组织为维持业绩隐藏事故和返工，成员承担羞耻与沉默，缺陷继续进入下一周期。
    individual: 个人因害怕身份受损而隐藏错误或受伤，短期维持表面，长期失去求助和修复机会。
    biological: 错误折叠蛋白被暂时封存却未清除，聚集体持续占用细胞质量控制能力。
    microscopic_min: 晶格把缺陷困在内部，外形仍完整，但局部应力随新增单元持续集中。
