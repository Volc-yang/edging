  stable_path: 少阳7保持九四，若显现强度无承载、无正应地突入外部，就会因无所容而迅速耗尽。
  changing_path: 太阳9由阳转阴，离变贲；外部突燃收敛，内容被放入边界、层次和适配形式中，获得可读呈现。
  principle: 显现强度只有被载体和接收容量承住，才能转化为持续影响。
  scale_anchors:
    cosmic_max: 高能天文爆发或航天器功率突升若无散热与测量动态范围，会烧毁设备或使数据饱和；需限幅和结构化记录。
    planetary_natural: 野火或强光突然进入未适应生态区会快速耗尽燃料并造成排斥性破坏，应有隔离与缓冲。
    social_organizational: 重大信息或产品突然全量发布而无基础设施、语境和支持，会过载并被用户弃用；应分层呈现。
    individual: 强烈情绪、才华或隐私突然无边界暴露，可能令自己与接收者都过载，需要节律和容器。
    biological: 信号突然高强激活而缺少缓冲与负反馈，会导致受体饱和、毒性或快速失活。
    microscopic_min: 高功率脉冲进入无散热介质会引起烧蚀，经过限幅和脉冲整形才能稳定传递。
  scale_mapping: 各尺度都由外部入口的强突发、承载与散热不足、快速耗尽和转为有边界形式组成；空间在第二轮显现入口，时间是峰值短于系统适应。
  scale_boundary: 分层呈现不能被用来审查或压制必要真相；涉及公共危险时应快速公开，同时提供足够语境、可访问渠道和保护措施。
