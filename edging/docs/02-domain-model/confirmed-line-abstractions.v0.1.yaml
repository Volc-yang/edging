  semantic_anchor: 短暂异常、观察等待、避免过治、证据升级
  stable_path: 少阳7保持九五，凭中心能力和六二反馈持续监测，不因焦虑对自限波动随意加药。
  changing_path: 太阳9由阳转阴，无妄变噬嗑；中心停止无依据试探，持续异常被当作明确障碍，进入取证、诊断和比例处置。
