    planetary_natural: 迁移或救援节点建立安全临时营地、资源登记和有报酬的地方支持，再组织长期供给。
    social_organizational: 临时项目团队获得明确工作空间、预算、数据备份和公平支持角色，随后形成稳定交付容器。
    individual: 旅行、搬迁或过渡期先找到安全住所、保管证件资金并建立可信联系人。
    biological: 迁移细胞在适配位置暂时落脚、保有核心物质并获得支持信号，随后组织转化。
    microscopic_min: 移动进程在临时主机落盘、保存状态并接入可靠守护进程，随后容器化运行。
  scale_mapping: 各尺度都由内部中位、临时安全落点、核心资源持有、外层对应缺失和公平支持接口组成；空间在二爻。
  scale_boundary: 古代童仆关系不具有现代正当性；支持者必须自愿、受尊重、有公平报酬、休息、安全和退出权。
  review:
    status: confirmed
