  variable_pattern: 治理失序应折断首要伤害源而不滥及同类，可无咎；九变阴时离变丰，终端强制退下，外卦转震，使集中辨治转为全局信息充分显现与广泛响应
  short_definition: 沿证据链定位关键决策、控制或传播节点，停止其伤害能力，同时保护无责者、依赖者和可修复部分；治理完成后公开全貌。
  semantic_anchor: 终端辨治、核心止害、区分无责、全局成丰
  stable_path: 少阳7保持上九，以最高辨明聚焦证据明确的首要伤害节点，不把关联或同类身份当作共同责任。
  changing_path: 太阳9由阳转阴，离变丰；终端集中执行收敛，信息与响应扩展到全局，形成更充分的公开和共同治理。
  principle: 纠正系统性伤害必须精准作用于控制结构，不能把治理退化为对群体的无差别清除。
  scale_anchors:
    cosmic_max: 航天系统定位引发级联故障的主控节点并隔离它，同时保留无故障模块；随后公开全网状态和恢复信息。
    planetary_natural: 生态治理针对已证实的关键污染源或传播节点，不无差别破坏整个物种或区域，并公开全流域证据。
    social_organizational: 调查聚焦制造伤害的决策链、权限和关键责任者，保护举报者、普通成员与必要服务。
    individual: 处理关系或团队失序时聚焦具体伤害行为和控制机制，不把与行为者有关的人一并定罪。
    biological: 免疫或治疗系统识别关键病变细胞与驱动信号，尽量保存健康同类组织，并启动全局修复。
    microscopic_min: 网络控制隔离产生级联错误的根节点而保留正常支路，随后广播完整状态用于重构。
  scale_mapping: 各尺度都由全局明察、关键控制节点、精准隔离和之后的信息全面展开组成；空间在最高治理端，时间从集中止害转为丰盛公开。
  scale_boundary: 本抽象不为战争、处决或集体惩罚背书；现实治理必须受法律、证据、比例、正当程序和基本权利约束。
