  scale_anchors:
    cosmic_max: 航天节点因过强操作损坏临时泊位并失去保障模块时任务危险，应停机赔偿和重建接口。
    planetary_natural: 外来团队破坏临时营地、生态和地方支持关系时必须停止行动、修复并补偿。
    social_organizational: 临时负责人以高压破坏工作环境并耗尽支持人员时会失去交付基础，应先修复劳动关系。
