  core_abstraction: 明性刚进入行动层时，多条痕迹和路径尚未分清，保持谨慎、逐步辨认才能避免把可见混杂误当成明确方向
  fixed_pattern: 离卦内外皆离，初九处第一重明的行动入口，阳居阳位得正，却与九四同阳不应；显现能力已启动，但没有外层互补来整理交错信息
  variable_pattern: 面对交错足迹保持敬慎并逐步辨路可无咎；九变阴时离变旅，最低明动撤去，主体失去固定附着点，转为在陌生环境中携带有限信息移动
  short_definition: 在信息初现而来源交错时，先标记证据、顺序、置信度和可回退步骤；不要因“已经看见”就假定“已经理解”。
  semantic_anchor: 初明交错、谨慎辨迹、分步校验、失附成旅
  stable_path: 少阳7保持初九，在显现入口逐条辨认交错痕迹，以敬慎保护正确行动路径。
  changing_path: 太阳9由阳转阴，离变旅；最低显现与附着撤去，认识离开固定基底，转入依靠有限标记的暂时移动。
  principle: 信息可见只是辨认的起点，方向必须由来源、顺序和反馈共同确定。
  scale_anchors:
