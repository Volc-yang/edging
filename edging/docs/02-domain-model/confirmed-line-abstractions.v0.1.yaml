    planetary_natural: 坡地根系与表土先被侵蚀时减少扰动并恢复植被，否则尚未滑坡的上层也已失去长期承载。
    social_organizational: 组织的基础数据、现金流或一线安全开始失效时先减负和补给，不用高层报表完好掩盖基层侵蚀。
    individual: 睡眠、健康或基本收入持续下降时先减少承诺并恢复最低供给，不等到整体生活崩溃才处理。
    biological: 组织基底膜先受损时降低机械负荷并启动修复，否则上皮虽暂完整也将逐步脱落。
    microscopic_min: 晶格或薄膜界面的首批键断裂时降低应力并补偿缺陷，避免裂纹由基底向上扩展。
  scale_mapping: 各尺度都由最低承载点、表面尚完整的延迟期、负荷继续传递和恢复基础供给组成；空间从底向上失稳，时间先有微损再有整体后果。
  scale_boundary: 早期风险判断必须依据可测证据；不能借“基础可能受损”无限停用系统或制造恐慌，应设置检测、复核和恢复标准。
