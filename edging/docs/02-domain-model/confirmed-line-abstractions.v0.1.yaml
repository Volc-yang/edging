  state_name: 潜势待位
  core_abstraction: 存在已经开始，显现尚未开始
  fixed_pattern: 强大生成能力已经形成，但仍位于系统内部最低层
  variable_pattern: 保持潜藏等待时位，或由乾变姤产生第一处开放
  short_definition: 结果已进入高潜势状态，但位置、响应和外部时机尚不足以支持显现。
  semantic_anchor: 内在强势、低位潜藏、时位未至、克制外显
  stable_path: 少阳7保持潜藏，继续形成位置和承载条件。
  changing_path: 太阳9由阳转阴，乾变姤，纯阳结构出现第一处开放和接触。
  principle: 事已成势，尚不可发。
  scale_anchors:
    cosmic_max: 宇宙暴涨前，时空尚未展开而生成时空的能量已经具足。
    planetary_natural: 土中种子已经吸水萌动，但胚根尚未破开种皮和土层。
    social_organizational: 核心方案已经成立，但授权、窗口和发布条件尚未具备。
    individual: 能力已经形成，但尚未取得能够承载和展示它的位置。
    biological: 受精卵已经形成，但第一次卵裂尚未发生。
    microscopic_min: 系统已越过内部激活阈值，但输出开关仍保持关闭。
  scale_mapping: 各尺度都具有强潜能、低位置、低可见度和未发生第一次外部展开的共同结构。
  scale_boundary: 锚点只对应潜势与显现的时位关系，不表示不同系统具有相同物理机制。
  review:
    status: confirmed
    notes: 乾卦核对通过
