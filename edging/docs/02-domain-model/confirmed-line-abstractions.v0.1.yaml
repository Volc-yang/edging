  fixed_pattern: 九三处下艮出口，阳居阳位得正却与上九同阳不应；它有强边界行动力但无最高互补，容易在临时环境中过度施力，把可承载关系烧穿
  variable_pattern: 栖处被毁、支持关系丧失，即使坚持原行动也危险；九变阴时旅变晋，边界强动退为承载，下艮转坤，破坏停止后系统转向在公开照明下逐步重建
  short_definition: 禁止以进度、情绪或主导欲破坏临时住所、设备和支持关系；发生损害后先停止、补偿、重建安全与信任，再谈推进。
  semantic_anchor: 边界强动、栖处被毁、支持离散、止损再晋
