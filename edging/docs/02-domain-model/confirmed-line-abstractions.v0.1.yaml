    biological: 细胞信号峰值下降后启动终止、回收和修复，清除阻碍恢复稳态的残余。
    microscopic_min: 脉冲或激发态衰减时记录完整曲线并处理导致异常长尾的缺陷态。
  scale_mapping: 各尺度都由显现峰值、自然衰减、情绪或制度性接受和残余障碍处理组成；空间在第一轮明的出口，时间从高照转向收束。
