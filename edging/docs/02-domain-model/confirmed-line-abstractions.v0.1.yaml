  fixed_pattern: 九四进入上离起点，阳居阴位失正并与初六正应；它能连接基层需要并持有行动工具，却处在不适配的外层位置，只能暂处而不能视为安居
  variable_pattern: 停在临时处并取得资源工具，内心仍不安；九变阴时旅变艮，外层主动使用退为承载，上离转艮，系统以停止、边界和稳定重新安置
  short_definition: 区分有设备、有预算与真正有合法位置、关系安全和长期承载；在位置未明时减少扩张，优先澄清身份、期限和退出安排。
