  core_abstraction: 处在决断终端的最后阻塞若失去通告、求助和纠错接口，就无法长期维持；持续沉默会让风险积累到不可逆的结构闭合
  fixed_pattern: 上六处上兑终端，阴居阴位得正并与九三正应；它是五阳推进下仅存的柔性端点，本有公开表达和跨层联系条件，但若不发出可信信号，真实对应也无法介入
  variable_pattern: 没有告警、说明或求助，终局风险必然显现且不可久长；六变阳时夬变乾，终端阻塞翻为主动，六位皆阳，系统进入纯行动与自我驱动状态
  short_definition: 为最高风险节点保留告警、申诉、停机和求助通道；若节点持续失联，按证据启动隔离与替代，使系统恢复完整行动，但不把失联者人格化为敌人。
  semantic_anchor: 终端孤点、号令失联、风险不可长、翻阳成乾
  stable_path: 少阴8保持上六，本可沿九三正应公开风险；若通告接口失效或被拒用，终端问题将累积至结构不能继续。
  changing_path: 太阴6由阴转阳，夬变乾；终端由被动阻塞转为主动功能，系统六位行动链完全连通，进入乾的纯动阶段。
  principle: 任何终局处置都应先保留表达和纠错通道；真正不可持续的是失联风险结构，不是某类人的存在。
  scale_anchors:
    cosmic_max: 编队末端节点失去告警与遥测后无法长期留在关键链路，应经证据隔离并启用替代模块，恢复全链主动运行。
    planetary_natural: 高风险设施若长期不报告状态且拒绝监测，治理系统需依法停运、替代并保持公众通告。
    social_organizational: 最高权限节点失去审计、申诉和停机接口时不可持续，应按程序限权并迁移职责，而非秘密清除人员。
    individual: 关系或生活中的高风险问题若无法沟通、求助或纠错，应借助专业支持建立安全隔离和替代安排。
    biological: 终端异常单元若不再传递检查点和求救信号，组织启动受控隔离与功能替代以维持整体。
    microscopic_min: 末端模块失去心跳、告警和回滚通道后被故障隔离，冗余节点接管并恢复完整执行链。
  scale_mapping: 各尺度都由最高终端、唯一残余阻塞、通告纠错接口、失联累积和隔离替代后恢复主动链组成；时间位于乾前一刻的最终决口。
  scale_boundary: "“终凶”不是对沉默者的惩罚预言；沉默可能来自压迫、障碍或无能力，系统应先提供可及求助，再依法、比例且可复核地保护整体。"
