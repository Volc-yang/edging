    planetary_natural: 旱季水量不可避免减少时，流域按生态底线、饮水与可替代用途排序分配，并监测各区反馈。
    social_organizational: 组织收缩时按安全、法定义务、依赖人群和可交接性安排退出顺序，而非让部门无序争抢。
