  state_name: 见险即止
  core_abstraction: 强动能刚进入蓄养系统就遇到明确风险时，立即停止输出，才能避免把可训练能力转成现实灾害
  fixed_pattern: 大畜下乾强动、上艮约止，初九居最低动力位，阳居阳位得正并与六四正应；危险信号与外层约束都已清楚，不存在继续试探的必要
  variable_pattern: 风险已现时停止推进有利于不犯灾；九变阴时大畜变蛊，起点动能退去，关注点转为检查积蓄内部已经形成的旧故障与腐坏
  short_definition: 检测到越限、失配或不可逆风险后，先停机、卸能和保全状态，再调查积累过程中是否已有结构性缺陷。
  semantic_anchor: 初动遇险、即时停机、保全状态、转查积弊
  stable_path: 少阳7保持初九，在六四约束信号到达时停止外推，把强动能留在可控范围。
  changing_path: 太阳9由阳转阴，大畜变蛊；最低动力源关闭，系统由蓄能推进转入对遗留缺陷、污染和维护失效的修治。
  principle: 高能系统的第一成熟能力，是在风险明确时能够可靠停止。
  scale_anchors:
    cosmic_max: 运载器刚点火即检测到结构共振时立即中止并卸载推进剂，随后检查长期维护和装配缺陷。
    planetary_natural: 水库初次蓄水发现坝基渗流越限时暂停水位上升，排压后调查历史地质与施工问题。
    social_organizational: 高资源项目启动即出现安全或合规红线时立即停用相关流程，并审查积累已久的制度缺陷。
    individual: 高强度计划刚开始就出现明确身体、财务或边界风险时先停止，不用意志力穿过警报。
    biological: 细胞强增殖信号刚启动便检测到DNA损伤时激活检查点，停周期并转入修复。
    microscopic_min: 储能器充电初段出现异常漏电或温升时切断电流，保留故障状态供根因分析。
  scale_mapping: 各尺度都由高能入口、明确越限信号、快速停机和对积累缺陷的后续检查组成；空间在最低动力源，时间在风险转成灾害以前。
  scale_boundary: 停机应有明确阈值、复核和恢复流程；不能用模糊危险感无限冻结正常活动，也不能让停机掩盖维护责任。
  review:
    status: confirmed
    notes: 预备草案；大畜初九变蛊；须按卦序审核；草案全量审核确认（2026-07-15）
