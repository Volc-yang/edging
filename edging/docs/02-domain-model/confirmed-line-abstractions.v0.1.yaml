  fixed_pattern: 六四进入外坎起点，阴居阴位得正，却与初六同阴不应；它位于刚柔两重风险交界，无完整对应，只能依靠近邻九五和有限接口传递诚实信号
  variable_pattern: 以简陋容器、少量供给和约定窗口建立联系，终可无咎；六变阳时坎变困，有限接口若承担过多主动输出，会显露资源枯竭和通道受限
  short_definition: 危机通信优先发送身份、状态、需求、容量和下一次联系时间，用最简单可靠的载体维持信任；不要让仪式复杂度阻塞救援。
  semantic_anchor: 跨险接口、简物实信、小窗连接、过载显困
  stable_path: 少阴8保持六四，以最低复杂度的真实资源和约定窗口连接九五，不以形式不足否定有效协作。
  changing_path: 太阴6由阴转阳，坎变困；小接口承担主动扩张后容量被耗尽，系统进入资源和表达都受限制的困境。
  principle: 危机中的通信价值由可靠性和可执行信息决定，不由形式完备程度决定。
  scale_anchors:
    cosmic_max: 深空链路受损时用低带宽窗口发送身份、姿态、能源和下次联络时间，而非等待完整数据包。
    planetary_natural: 灾区基础设施失效时以简易物资点和固定短时通信窗口维持救援协作。
    social_organizational: 危机团队用一个可信频道和简短状态格式共享关键资源、风险与承诺，不让复杂汇报阻塞行动。
    individual: 困难中无法完整表达时，先用简单可信的信息说明安全、需要和下次联系，而不因形式不完美沉默。
    biological: 受损组织通过少量高特异信号和狭窄通道维持修复协调，避免广泛高耗激活。
    microscopic_min: 低带宽信道用最小编码传输状态与校验位，保持同步而不过载。
  scale_mapping: 各尺度都由受损正式通道、低容量窗口、少量高价值信息和过载后枯竭组成；空间在内外险交界，时间靠重复约定维持连续性。
  scale_boundary: 简约不能删除必要的安全、同意和责任信息；低带宽也不应成为上层隐瞒风险或压缩受影响者表达的借口。
  review:
    status: confirmed
    notes: 预备草案；坎六四变困；须按卦序审核；草案全量审核确认（2026-07-15）
