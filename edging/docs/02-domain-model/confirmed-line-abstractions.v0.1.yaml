    planetary_natural: 蓄水设施水量充足但下游尚未准备时关闭并机械锁定闸门，同时公开水位和闸态。
    social_organizational: 团队能力充足但数据或授权未完成时撤下生产权限，用系统隔离而非口头要求阻止上线。
    individual: 人在情绪或冲动很强时先离开操作环境、冻结交易或交出钥匙，使冲动不能直接驱动高后果行为。
    biological: 运动蛋白仍有能量时通过解除与货物或轨道的结合停止运输，而非耗尽全部ATP。
    microscopic_min: 电源仍带电但负载条件异常时断开继电器，并由状态指示准确显示隔离。
  scale_mapping: 各尺度都包含完整动力源、未就绪载荷、可验证解耦点和状态可见性；空间从动力到载荷的中间轴断开，时间为暂存而非毁弃能力。
  scale_boundary: 解耦应尽量可逆且防止误复位；紧急隔离后仍须查明条件，不能把长期闲置当作完成治理。
