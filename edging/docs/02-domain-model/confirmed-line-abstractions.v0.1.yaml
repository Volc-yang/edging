  semantic_anchor: 外层来援、制度重载、正应仍在、迟而有终
  stable_path: 少阳7保持九四，虽位置失当且受重载拖慢，仍沿初六正应持续到达最低受困点。
  changing_path: 太阳9由阳转阴，困变坎；救援入口主动性退下，内外皆坎，原有延迟转成重复险境。
  principle: 救援质量不仅看资源规模，更看资源能否及时穿过自身制度负荷到达真实对象。
  scale_anchors:
    cosmic_max: 救援飞行器设备齐全却因复杂对接和载荷过重迟到时，保持直连遥测、减载并给出可信到达窗口。
    planetary_natural: 灾害救援被大型装备和多层审批拖慢时，开放轻量通道直达受影响社区，避免次生风险。
    social_organizational: 支持团队因流程、汇报和工具负担迟迟不能帮助一线时，削减手续并维持直接状态更新。
    individual: 承诺帮助他人却被自己的工作、面子或复杂安排拖慢时，诚实说明、减少负荷并保持联系，不消失。
    biological: 修复细胞携带过重反应负荷而迁移缓慢时，降低非必要激活并保持对损伤信号的追踪。
    microscopic_min: 恢复代理因镜像、依赖和认证过重而迟到时切换轻量路径，持续心跳并避免故障递归。
  scale_mapping: 各尺度都由外层救援入口、最低受困点正应、载具或制度负荷、延迟但持续到达和失去主动后的重复风险组成。
  scale_boundary: "“有终”不能替迟延免责；救援者应公开时限、承担可避免延误的责任，并允许更快的替代支持进入。"
