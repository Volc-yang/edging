  core_abstraction: 存在开始被世界看见
  fixed_pattern: 内在力量第一次进入可见、可识别、可连接的现实空间
  variable_pattern: 保持可见成长，或由乾变同人进入共同场域
  short_definition: 能力已经形成稳定可见的表达，但仍处成长位置，需要通过正确连接进入更大场域。
