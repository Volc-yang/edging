  state_name: 未盈求平
  core_abstraction: 治理风险中心不应追求把危险容器填满或展示最大控制力，而应维持不越顶、能流出和接近平衡
  fixed_pattern: 九五居外坎之中，阳居阳位得正且居中，虽与九二同阳不应，却是第二重险中最稳定的流动核心；其任务是调平水位而非扩大险量
  variable_pattern: 风险尚未盈顶且已接近平衡，可无咎但规模仍不可自大；九变阴时坎变师，中心流动撤去后，个体调节转为有纪律的集体风险组织
  short_definition: 通过泄流、分担、缓冲和监测把风险维持在阈值以下，接受尚未完全消失；若中心能力不足，就建立明确角色和集体响应。
  semantic_anchor: 中心调平、不过满顶、有限无咎、组织应险
  stable_path: 少阳7保持九五，让外险中心持续流动和调平，不把容器充满视为能力证明。
  changing_path: 太阳9由阳转阴，坎变师；中心单点调节退下，风险应对转为有角色、纪律和共同目标的集体行动。
  principle: 风险治理的成功标准是维持可控余量和流动出口，不是把系统推到极限仍未失败。
  scale_anchors:
    cosmic_max: 航天器在高辐射或热负荷中维持低于上限并持续散逸，不以接近满容量运行证明性能；不足时启用编队响应。
    planetary_natural: 水库在汛期保持防洪库容并动态泄流，不追求满蓄；超出单站能力时按流域协同调度。
    social_organizational: 组织维持风险预算、人员余量和问题出口，不把全员满负荷当效率；必要时建立跨团队应急编组。
    individual: 人在压力期保留睡眠、资金和时间余量，目标是接近平衡而非把所有容量用尽。
    biological: 稳态中心把渗透、压力或代谢负荷维持在阈值下并持续排出，越限时启动组织级响应。
    microscopic_min: 缓冲器保持未饱和区和泄放通道，避免信号或电荷填满导致非线性失控。
  scale_mapping: 各尺度都由风险容器、中心流动、未满余量、泄流平衡和超出单点后的集体组织组成；空间位于外险中心，时间是持续调平。
  scale_boundary: 平衡指标必须包含风险由谁承担；不能通过把水位、成本或伤害转移给无权者来制造中心“未盈”。
  review:
