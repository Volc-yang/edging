  state_name: 缚棘久困
  core_abstraction: 重复风险走到终端仍失去路线时，多层约束会相互缠结，使主体长期无法恢复行动与反馈
  fixed_pattern: 上六处外坎终端，阴居阴位得正却不中，并与六三同阴不应；位置形式正确但没有主动出口或下层互补，风险最终固化为束缚、隔离和长期停滞
  variable_pattern: 被多重约束封闭且长期不能恢复会趋凶；六变阳时坎变涣，终端获得主动疏散能力，固结约束被分解，通道和群体重新流动
  short_definition: 当规则、债务、创伤、技术锁定或物理障碍互相加强时，不能再靠主体单点挣扎；需要逐层解除约束、恢复通信并建立可检验的释放路径。
  semantic_anchor: 终端失道、多层束缚、长期停滞、解结成涣
  stable_path: 少阴8保持上六，若终端无出口且与六三失去对应，多层约束会固化成长期不可行动状态。
  changing_path: 太阴6由阴转阳，坎变涣；终端开始主动分解和疏散约束，封闭风险转为可流动、可重组的开放通道。
  principle: 长期被困常是多个约束相乘的结果，解困必须逐层拆除结构，而不是要求主体更用力。
  scale_anchors:
    cosmic_max: 航天器同时被轨道、能源、通信和姿态故障锁定时，需按依赖顺序解锁并恢复链路，不能只增加单一推力。
    planetary_natural: 河流被多重堰塞、污染和岸线硬化困住时，需分层疏通水文与生态连接。
    social_organizational: 人员被合同、债务、权限和信息封锁同时困住时，需跨机构解除约束并建立可申诉退出路径。
    individual: 长期困境由健康、财务、关系和环境共同构成时，需要多层支持，不应把无法自拔归咎为意志不足。
    biological: 组织同时受纤维化、缺血和炎症束缚时，单一治疗难以恢复，需逐层打开通路。
    microscopic_min: 网络陷入多个耦合锁定态时，须按依赖关系解除约束，使能量和信息重新扩散。
  scale_mapping: 各尺度都由终端无出口、多种约束相乘、时间性固化和分层疏散组成；空间位于最外端封闭处，时间越久越需结构化解锁。
  scale_boundary: 本抽象不认可残酷拘禁或长期惩罚；任何限制都应有正当程序、比例、复核、期限和恢复权利。
  review:
    status: confirmed
    notes: 预备草案；坎上六变涣；须按卦序审核；草案全量审核确认（2026-07-15）
