  short_definition: 对刚出现的异常、欲望、连接或创新先设置限幅、沙箱和停止条件，观察其真实行为；验证通过后才决定吸收、释放或恢复原结构。
  semantic_anchor: 少阴初生、柔变量入、入口制动、翻阳复乾
  stable_path: 少阴8保持初六，以柔性渗透沿九四正应影响外层；通过可靠制动将其限制在可观察范围。
  changing_path: 太阴6由阴转阳，姤变乾；入口异质性转为主动同质功能，六层恢复连续驱动。
  principle: 新变量的风险由传播能力和接口条件决定，不由其弱小、陌生或主体身份决定；最早约束也最节省系统成本。
  scale_anchors:
    cosmic_max: 深空系统检测到首个微弱轨道或协议偏差时立即限幅并保留遥测，验证后再恢复全编队主动运行。
    planetary_natural: 生态系统发现早期外来扩散因子时建立局部监测与隔离，不因数量少而忽略，也不先作物种污名化。
    social_organizational: 组织对新权限、外部连接或异常交易先放入受控流程，设置额度、审计和停止条件。
    individual: 新的强烈冲动、关系或机会出现时先放慢节奏、保留边界和验证期，不让一瞬吸引接管长期选择。
    biological: 细胞检测到首个异常信号时启动检查点与局部抑制，在确认功能后决定继续或终止。
    microscopic_min: 电路或网络出现首个异质脉冲时由限流器和沙箱捕获，确认兼容后再接入主链。
  scale_mapping: 各尺度都由原本完整主动结构、最低入口的新异质变量、低阻传播与可靠制动组成；时间是乾后少阴出现的第一刻。
  scale_boundary: 约束应针对可验证行为和传播路径，不能借“防微杜渐”歧视新人、女性、少数群体或陌生文化；措施须比例、可复核并可解除。
