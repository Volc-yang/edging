  state_name: 淤底时弃
  core_abstraction: 公共资源系统的最低源头若被沉积污染、失去流动并长期无人维护，即使设施名称仍在，也已不能支持基本使用和生态来访
  fixed_pattern: 井卦下巽入地、上坎出水，初六处资源最底层，阴居阳位失正且与六四同阴不应；源头承载弱、维护接口断开，旧结构随时间被使用网络放弃
  variable_pattern: 井底成泥则不可取用，旧井连最低生态访问也消失；六变阳时井变需，底层取得主动清理与支撑力，下巽转乾，系统进入等待水源、检测和条件成熟的阶段
  short_definition: 先确认源头是否污染、淤塞和失去补给，停止使用并清理底层；修复后等待质量验证，不因设施仍存在就假定资源可用。
  semantic_anchor: 源底淤积、旧构失用、访问消失、清后待需
  stable_path: 少阴8保持初六，在无六四维护对应时底层持续淤积，公共资源系统被时间和使用者共同舍弃。
  changing_path: 太阴6由阴转阳，井变需；底层获得主动修复能力，但清理后仍须等待补给、检测和安全条件到位。
  principle: 公共设施的价值取决于源头质量与持续维护，不取决于名称、历史或物理外壳仍然存在。
  scale_anchors:
    cosmic_max: 深空补给源底层储罐污染且循环停滞时停止使用并清理，随后等待补给与质量验证。
    planetary_natural: 废弃水井、湿地或地下水源淤积污染后先封控和修复，不以历史用途证明当前安全。
    social_organizational: 公共数据库、基金或服务若底层数据和资源已腐败，应暂停调用、清理源头并重新认证。
    individual: 长期不用的知识、习惯或支持渠道若已失真失效，先检查和更新，不凭过去经验直接使用。
    biological: 组织液源或导管底部沉积堵塞时停止输送，清除污染并等待稳态恢复。
    microscopic_min: 存储底层数据腐化且缓存停滞时隔离介质、执行清理，并等待完整性校验。
  scale_mapping: 各尺度都由最低资源源头、沉积污染、维护对应缺失、使用网络退出和清理后等待组成；空间在初爻，时间是公共资源衰败起点。
  scale_boundary: "“时舍”不等于永久放弃受影响社区；停止使用应同时提供替代资源、修复计划、公开检测与公平过渡支持。"
