    planetary_natural: 流域污染、荒漠化或疫后恢复采用多年治理，成果交由透明专业机制维护。
    social_organizational: 机构清理长期债务或腐败需持续投入，完成后不把关键权限交给邀功且无监督者。
    individual: 处理长期疾病、债务或创伤时按阶段推进，见效后仍保留支持与边界，不让短期冲动接管。
    biological: 组织长期清除顽固病灶后安排免疫收敛和修复，避免疲劳单元误控。
    microscopic_min: 系统长期迁移或清理技术债后实施权限交接、审计和维护者轮换。
  scale_mapping: 各尺度都由内外边界、主动长期行动、最高终端反馈、深层障碍、持续消耗、胜后用人和退力后的重新屯难组成；空间在三爻。
  scale_boundary: 古代征伐只抽象为非暴力的长期问题治理；不得据此正当化战争、污名群体或剥夺任何人的基本权利。
