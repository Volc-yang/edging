  variable_pattern: 强止腰际、撕裂纵向联系会使危险持续压迫内部；九变阴时艮变剥，关节刚力退下，下艮转坤，支撑从内部开始层层剥落
  short_definition: 不要在高负荷运动中突然锁死核心接口；先降载、分段制动、释放应力并保护连续支撑，防止停止动作本身造成损伤。
