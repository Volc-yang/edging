  scale_mapping: 各尺度都由外部载荷入口、最低支点正应、支撑能力与公共负荷失配、倾覆和事故后治理积弊组成；空间在四爻。
  scale_boundary: 事故问责须基于证据并覆盖设计、管理和资源配置，不能羞辱伤员或基层执行者；修复应包含补偿和独立审查。
