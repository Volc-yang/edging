  state_name: 权心缓解
  core_abstraction: 治理中心若同时受功能损伤与惩罚性权力装置约束，即使位置中正也难以立即施救；恢复必须沿中直原则逐步解除伤害性接口
  fixed_pattern: 九五居上兑之中，阳居阳位得正且居中，却与九二同阳不应；中心具有公开治理能力，但上下主动单元缺少互补，权力系统自身造成识别、行动和信任损伤
  variable_pattern: 功能被削损且受身份权力装置所困时，需缓慢恢复表达与行动，并以共同原则重建正当性；九变阴时困变解，治理中心强控制退下，上兑转震，系统获得解除束缚的行动
  short_definition: 停止惩罚性规则、恢复受损功能、公开纠错与补偿，按中立证据逐步松绑；把中心权力转为可验证的解困能力。
  semantic_anchor: 治理中心、功能受损、权制成困、中直缓解
  stable_path: 少阳7保持九五，虽中正有能，却因九二不应和惩罚性接口难以贯彻意图，只能沿中直逐步修复。
  changing_path: 太阳9由阳转阴，困变解；中心直接控制收敛，外层由表达转为释放行动，约束开始解除。
  principle: 当治理系统本身制造损伤时，解困从停止伤害、恢复功能和接受问责开始，而不是要求受困者适应。
  scale_anchors:
    cosmic_max: 任务中心因错误安全机制同时失去感知与执行能力时，逐步撤销伤害性锁定、恢复遥测并验证释放。
    planetary_natural: 治理中心被惩罚性管制和失真数据困住时，停止伤害措施、恢复地方监测和补偿，再逐步解禁。
    social_organizational: 机构取消使人失声失能的惩罚制度，恢复权限、申诉和补偿，并让中心接受独立审计。
    individual: 关系中的决策中心若靠羞辱、威胁或剥夺维持秩序，应先停止伤害、修复功能和信任，再谈继续合作。
    biological: 调控中心受损且过度抑制组织时，逐步解除异常抑制、恢复感知和修复信号。
    microscopic_min: 控制器因错误保护逻辑失去输入输出时，按验证步骤撤销锁定、恢复通道并保留审计。
  scale_mapping: 各尺度都由外层治理中心、感知与行动功能受损、惩罚性约束、中直修复和中心退控后的释放组成；空间在五爻。
  scale_boundary: 古文肉刑只作为功能损伤警示，绝不构成暴力正当化；现实修复应保障受害者安全、补偿、法律救济和自主选择。
