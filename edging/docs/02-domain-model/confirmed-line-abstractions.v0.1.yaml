    planetary_natural: 生态区长期获得大量但比例错误的营养输入，会富营养化并失去功能，绿色外观不等于健康。
    social_organizational: 组织持续接受与使命不匹配的资金、指标或信息，会重塑行为并损害核心服务。
    individual: 长期摄取不适合自己的信息、关系或物质，即使来源受欢迎，也可能降低健康与判断。
    biological: 细胞获得丰富但比例或时序错误的营养与生长信号，会形成代谢失衡。
    microscopic_min: 材料持续吸收不匹配波长或过量能量会产生缺陷，表面光泽无法补偿结构损伤。
  scale_mapping: 各尺度都由稳定来源、接收结构失配、长期功能下降和外观掩盖组成；空间有跨层对应却无本层适配，时间风险来自持续累积。
  scale_boundary: "“不适配”必须依据可测功能和个体差异判断，不能用传统、身份或偏见排斥新的食物、知识、文化或支持方式。"
