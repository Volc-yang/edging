  state_name: 久克慎任
  core_abstraction: 完成态到达内外边界后，清除长期遗留的深层障碍需要多年级持续投入；即使最终克服，也不能把后续权力交给短视、邀功或不受约束的执行者
  fixed_pattern: 九三处下离出口，阳居阳位得正并与上六正应；边界有主动识别和终端反馈，能够处理顽固外患，但任务周期长、消耗高且易在胜利后被机会主义接管
  variable_pattern: 长期治理可克服深层问题，疲惫时不可任用不负责任者；九变阴时既济变屯，边界主动性退下，下离转震，系统回到资源初聚、秩序未成的困难开端
  short_definition: 对系统性积弊采用长期、可审计治理，预先安排轮换和恢复；完成后把权限交给受约束的专业机制。
  semantic_anchor: 边界得正、深患久克、疲惫慎任、退力成屯
  stable_path: 少阳7保持九三，沿上六正应持续处理深层障碍，同时限制短视执行者进入关键权位。
  changing_path: 太阳9由阳转阴，既济变屯；长期行动力耗退，边界重新进入初创混乱与资源聚集。
  principle: 长期胜利不仅取决于克服障碍，也取决于疲惫阶段的权力交接和恢复安排。
  scale_anchors:
