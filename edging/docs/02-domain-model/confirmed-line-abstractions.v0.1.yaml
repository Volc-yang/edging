  principle: 新旧路径之间的迟疑是一种信息；在支撑不明时不被迅速牵走，往往比勉强前进更安全。
  scale_anchors:
    cosmic_max: 航天器因未知扰动失去稳定承载时暂停机动，未锁定可疑信号源，随后依据遥测厘清控制权冲突。
    planetary_natural: 生态迁移边界因新因子扰动而暂时停滞时保留缓冲区，不强接未知通道，并调查资源权责。
    social_organizational: 新系统扰动旧流程却无可靠交接时暂停上线，不因进度压力绑定供应商，随后按合同和证据解决争议。
    individual: 新机会使原有生活失稳但条件仍含混时允许自己迟疑，不因不适立即作出依附性承诺。
    biological: 细胞在基质改变且新趋化信号未确认时减慢迁移，避免被错误梯度牵引。
    microscopic_min: 执行模块失去稳定参考但未锁定新时钟时停在安全态，随后通过日志仲裁接口冲突。
  scale_mapping: 各尺度都由内外行动边界、旧支撑受损、新牵引未形成、迟行和后续权责澄清组成；时间是相遇尚未稳定配对的中间段。
  scale_boundary: 迟疑不应被羞辱为无能，也不能被组织利用来无限悬置个人权利；应提供信息、支持、申诉和明确决策期限。
