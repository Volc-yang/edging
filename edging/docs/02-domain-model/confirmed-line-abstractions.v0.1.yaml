    planetary_natural: 迁徙群体个体若只跟前方运动而忽略地形与容量，易形成拥堵；共同场需多源反馈。
    social_organizational: 执行团队只追随高层口号而无目标和停止规则，会以强行动扩大错误；应转为共同决策。
    individual: 个人因他人期待或群体热度持续行动时，应核对自己的目的、同意和退出条件。
