  state_name: 开衢通蓄
  core_abstraction: 积蓄能力经过止动、解耦、训练与去风险后，终端约束应转成开放通道，使成熟资源进入广域流通
  fixed_pattern: 上九处上艮终端，阳居阴位失正而不中，并与九三同阳不应；它是最后一道主动止界，蓄养已满，继续占据顶端会使能力无路可行
  variable_pattern: 终端开放为广阔公共路径，积蓄之道才真正亨通；九变阴时大畜变泰，上艮转坤承载，下乾动力与上坤贯通，形成上下交换
  short_definition: 在能力达到放行标准后，撤除临时瓶颈，建立平等、可审计和有容量边界的分发网络；释放不是失控，而是从封存治理转为流通治理。
  semantic_anchor: 蓄养完成、终端开路、广域流通、上下成泰
  stable_path: 少阳7保持上九，主动把最终止界转作可通行的广域接口，让成熟能力不再困于封存。
  changing_path: 太阳9由阳转阴，大畜变泰；顶层主动阻挡退为承载，下层强能向上交换，系统进入上下贯通的流通状态。
  principle: 蓄养的完成标志不是储量最大，而是资源能够经过成熟通道安全服务更广系统。
  scale_anchors:
    cosmic_max: 经完整验证的深空通信与能源平台开放标准接口，让多个任务共享容量，并以配额和遥测治理流通。
    planetary_natural: 水库完成安全蓄水后按生态流量和下游需求开放通道，使储水进入整个流域交换。
    social_organizational: 组织把成熟知识、基础设施和资金从内部封存转为透明接口与公共服务，同时保留容量和审计规则。
    individual: 个人积累的能力成熟后通过教学、合作或服务进入真实关系，而不以永远准备为由持续囤积。
    biological: 储存细胞在全身信号和安全阈值满足后释放能量或产物，进入组织间受控交换。
    microscopic_min: 储能元件在负载匹配和保护就绪后打开输出通道，以限流和反馈向网络稳定供能。
  scale_mapping: 各尺度都由长期积蓄、放行标准、终端瓶颈撤除和受控广域分发组成；空间由封闭顶点变为上下通道，时间由太阳积盛进入流通。
  scale_boundary: 开放不等于无条件释放；涉及稀缺、安全、隐私或生态承载的资源仍须有配额、授权、监测和退出机制。
  review:
    status: confirmed
    notes: 预备草案；大畜上九变泰；须按卦序审核；草案全量审核确认（2026-07-15）
