  state_name: 脱轴停载
  core_abstraction: 动力仍强但承载条件尚未就绪时，应主动断开动力与载荷的机械耦合，使系统无法误启动
  fixed_pattern: 九二居下乾之中，阳居阴位失正但得中，并与六五正应；它具有持续驱动能力，也准确接到中心约束，因此可在不破坏动力源的情况下解除传动
  variable_pattern: 主动脱开承载连接可避免错误前行而无尤；九变阴时大畜变贲，动力退下后，系统转向检查接口、标记和形式是否忠实表达实际承载状态
  short_definition: 当设备、团队或个人有能力却不具备安全载荷条件时，使用物理、权限或流程隔离，而不只依赖“不要启动”的口头提醒。
