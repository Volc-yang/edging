  state_name: 弃本逐食
  core_abstraction: 拥有基本自养与判断能力的主体若放弃内部反馈，只追逐外部可见供给，就会把需求调节权交给他者
  fixed_pattern: 颐下震启口、上艮止口，初九是最低主动边界，阳居阳位得正并与六四正应；它本有启动自养的能力，却可能把注意力完全投向外层供给者
  variable_pattern: 舍弃自身调节而凝视他者摄取，会使主动能力贬损并趋凶；九变阴时颐变剥，最低自养源消失，整个供给结构从基础开始剥落
  short_definition: 先读取自身真实需求、现有储备和可承受量，再选择外部资源；不能让比较、诱导或可见消费替代内部感知。
  semantic_anchor: 本有自养、外部诱食、调节权转移、基础剥落
  stable_path: 少阳7保持初九，以自身反馈启动摄取和行动，不把六四外部供给当作唯一需求来源。
  changing_path: 太阳9由阳转阴，颐变剥；最低主动调节量撤去，养护系统失去基础支点并进入由下而上的剥落。
  principle: 外部资源只有经过内部需求校验，才构成养分；否则它只是吸引物。
  scale_anchors:
    cosmic_max: 自主航天器本有能源与姿态反馈，若只追随外部高强信标而忽略自身储备，会从基础控制层失稳。
    planetary_natural: 生态系统若放弃本地循环而持续依赖外来高投入，土壤和食物网的自养基础会逐层退化。
    social_organizational: 组织已有真实用户与能力反馈，却只追逐竞品规模、资本偏好或可见流量，会失去基础服务能力。
    individual: 个人忽略饥饿、疲劳、兴趣和预算，只因他人展示而消费，会把自我调节交给外部刺激。
    biological: 细胞忽略能量与渗透反馈而持续响应外源促摄取信号，会破坏内部稳态。
    microscopic_min: 控制单元忽略本地传感，只跟随外部强输入，会使底层反馈环断开并产生漂移。
  scale_mapping: 各尺度都由本地自养反馈、外部显著供给、注意力转移和基础调节失效组成；空间在最低摄取入口，时间在依赖固化以前。
  scale_boundary: 自养不等于拒绝照护、公共支持或必要依赖；重点是保留需求表达和选择权，不把需要帮助污名化。
  review:
    status: confirmed
    notes: 预备草案；颐初九变剥；须按卦序审核；草案全量审核确认（2026-07-15）
