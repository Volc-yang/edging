  changing_path: 太阳9由阳转阴，井变蹇；内部汲取收敛，系统由隐性泄漏转为显性停止和路径阻碍。
  principle: 公共资源不足有时不是源头短缺，而是旁路优先和容器泄漏；扩产前应先修复传输效率。
  scale_anchors:
