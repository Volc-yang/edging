  state_name: 内包勿扩
  core_abstraction: 异质变量进入内部中心后，应先由本地能力完整包容、辨识和处置，不宜在性质未明时转交外部使用或扩大暴露面
  fixed_pattern: 九二居下巽之中，阳居阴位失正但得中，并与九五同阳不应；它有主动容纳初六的能力，却缺少外层中心互补，适合内部封装而不适合对外分发
  variable_pattern: 容器中已有可管理对象可无咎，但不宜立即供给外部来宾；九变阴时姤变遁，内部主动处理退为柔性边界，系统通过拉开距离保护核心
  short_definition: 把首次接触的数据、样本、资源或关系留在最小可信域内完成验证，不向无关方扩散；必要时降低接触面并后撤。
  semantic_anchor: 内部得中、对象已包、未验不分、收敛成遁
  stable_path: 少阳7保持九二，以中度能力在内部包容初六变量；因九五不应，暂不扩大到外部中心或来宾。
  changing_path: 太阳9由阳转阴，姤变遁；内部处理主动性降低，系统转为减少接触、保全核心和等待更清楚条件。
  principle: 首次接触后的合理动作是最小范围验证，而不是把未经理解的新对象迅速商品化、公开化或关系化。
  scale_anchors:
    cosmic_max: 航天器捕获未知样本或信号后先在本地隔离舱分析，不向全编队广播可执行内容，必要时拉开距离。
    planetary_natural: 流域发现未知污染物或生物样本后在受控实验与区域内辨识，不跨区转运或商业利用。
    social_organizational: 机构收到敏感数据或新外部组件后仅在最小授权团队验证，不向客户和合作方提前分发。
    individual: 刚获得私密信息、资源或新关系机会时先自行核实和理解，不把它扩散给无关者。
    biological: 细胞将新进入的物质封装在局部囊泡中处理，不在未识别前释放到全组织。
    microscopic_min: 节点把未知输入封装在隔离缓存和测试域内，不向生产总线或外部客户端传播。
  scale_mapping: 各尺度都由内部中心、已进入的异质对象、局部封装、外部接口未配对和必要时后撤组成；时间是初遇后的第一轮辨识。
  scale_boundary: "“不利宾”只表示暂不扩大接口，不授权扣留他人财物、信息或人身自由；保密与隔离必须有合法依据、最小范围和期限。"
  review:
