    planetary_natural: 生态监测用中等、连续且可比的指标显现环境变化，使长期数据可供共同治理。
    social_organizational: 组织以适度粒度公开数据、定义和不确定性，使透明度既可理解又能支持公共决策。
    individual: 个人清楚表达事实和感受，同时保留语境与分寸，使对方能够接收而非被强度淹没。
    biological: 感光或信号系统把输入保持在动态范围内，使细胞能区分梯度而不发生受体饱和。
    microscopic_min: 探测器在线性响应区测量光强，校准后的信号可累积为可靠数据集。
  scale_mapping: 各尺度都由发射强度、中心承载介质、接收动态范围和信息资产化组成；空间在内层中心，时间上通过稳定校准形成积累。
  scale_boundary: 适度呈现不能成为压低紧急事实或弱化受害者声音的理由；信息强度应匹配风险与接收需要，而非权力偏好。
