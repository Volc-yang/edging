    biological: 营养已进入局部但因转运体破损而泄漏、仅供旁支反应时，先修复膜与主输送通路。
    microscopic_min: 数据或能量在内部缓存存在却被旁路任务占用、接口漏失时，修复容器并阻断非必要分流。
