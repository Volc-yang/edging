  state_name: 源控钝牙
  core_abstraction: 成熟风险已经具有破坏工具时，应降低驱动破坏的根源，而不只在末端与其锋利表现反复对抗
  fixed_pattern: 六五居上艮之中，阴居阳位失正但得中，并与九二正应；它能从治理中心读取中层动力，适合用柔中调节改变风险来源而非硬碰输出
  variable_pattern: 去除持续驱动攻击的根因，现有锋利结构也会失去主要危害而吉；六变阳时大畜变小畜，中心调节主动化，大规模约束转为细密、持续的小尺度控制
  short_definition: 找出造成危险输出的激励、能量、压力或反馈回路，优先改变源变量，同时保留末端防护；治理从一次强制转为连续微调。
  semantic_anchor: 成熟风险、根因降驱、保留防护、细密调节
  stable_path: 少阴8保持六五，以柔中方式降低九二动力中的破坏性驱动，使锋利末端不再持续获得能量。
  changing_path: 太阴6由阴转阳，大畜变小畜；中心根因治理转为主动而细密的日常调节，用小约束维持风险不再积大。
  principle: 末端危险必须防护，但长期降低风险要改变使危险反复获得能量的源头。
  scale_anchors:
    cosmic_max: 对反复产生高速碎片的轨道系统，不只拦截碎片，还关闭错误释放机制并持续微调轨道与能量。
    planetary_natural: 治理洪灾不只加高堤坝，也恢复上游蓄水、湿地和用地约束，降低洪峰驱动。
    social_organizational: 组织不只处罚事故末端人员，还调整制造冒险的指标、资源短缺和沉默反馈，并持续小步监测。
    individual: 面对反复爆发的有害行为，除设置即时边界外，也处理睡眠、压力、成瘾或错误激励等可验证根因。
    biological: 疾病治理在阻断有害效应器之外，也调节持续激活它的上游信号，并维持低强度监测。
    microscopic_min: 抑制尖峰输出除加末端钳位外，还降低振荡源增益并用细粒度反馈稳定系统。
  scale_mapping: 各尺度都由已有锋利输出、持续供能根因、中心柔性调节和后续小尺度控制组成；空间从末端回溯源头，时间从急性拦截转为长期稳态。
  scale_boundary: 根因治理不能成为延迟保护受害者的借口；当危险正在发生时，必须先隔离末端风险，再处理来源。
