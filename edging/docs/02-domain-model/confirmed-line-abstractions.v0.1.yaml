  state_name: 时穷止行
  core_abstraction: 即使动机真实，行动走到时位终端仍继续外推，也会因条件耗尽而产生错误；无妄不能替代时机判断
  fixed_pattern: 上九处上乾终端，阳居阴位失正而不中，虽与六三正应却已到局部过程尽头；真实动能仍在，但没有更高空间可承接继续推进
  variable_pattern: 终端继续行动会产生灾误而无所利；九变阴时无妄变随，最高层主动推动退下，系统改为跟随已经更新的条件、反馈和关系
  short_definition: 在目标完成、资源耗尽、窗口关闭或边界到达后停止推进，重新读取环境；善意和诚实不能使过期路径继续有效。
  semantic_anchor: 真实动机、时位已穷、停止外推、随变更新
  stable_path: 少阳7保持上九，若仅凭真实动机继续向无承载空间推进，行动仍会因时穷造成损失。
  changing_path: 太阳9由阳转阴，无妄变随；终端推动力收敛，主体停止强行外行，转而跟随新事实和可承接关系。
  principle: 动机真实性只能约束起点，不能保证任何时刻、尺度和方向上的行动都正确。
  scale_anchors:
    cosmic_max: 探测器已越过有效通信和燃料窗口时，即使任务目标真实也不能继续加速，应停止并随新的轨道条件调整。
    planetary_natural: 修复工程达到生态承载上限后继续施工会造成扰动，应退出并跟随自然演替反馈。
    social_organizational: 项目使命真实但目标已完成或资源条件改变时，继续扩张会制造工作本身，应关停或随需求重组。
    individual: 一项承诺已经完成、关系边界已改变或身体容量已尽时，善意也不能合理化继续介入。
    biological: 修复反应在组织闭合后若继续增强，会转成纤维化或炎症，必须随终止信号收敛。
    microscopic_min: 反应到达终点后继续输入能量会增加副反应，控制器应停止驱动并跟随平衡状态。
  scale_mapping: 各尺度都由真实初衷、过程终点、继续输出导致的副作用和依据新条件收敛组成；空间已无上位承载，时间已过有效窗口。
  scale_boundary: 止行不是消极服从；若新的事实显示仍有责任或危险，应转换方法继续承担，而不是借“时穷”逃避必要行动。
  review:
