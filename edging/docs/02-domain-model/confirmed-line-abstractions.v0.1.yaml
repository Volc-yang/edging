  stable_path: 少阳7保持九二，依据六五中心约束主动解除动力到载荷的连接，保存能力而停止运载。
  changing_path: 太阳9由阳转阴，大畜变贲；中层驱动力撤去，注意力转到接口形式、状态标记和承载关系的真实呈现。
