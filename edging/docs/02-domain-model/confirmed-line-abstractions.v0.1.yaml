  short_definition: 建立可退出的住所、资源清单、备份和当地支持关系，明确对方职责、报酬与权利；稳定后把零散资源组织成可用系统。
  semantic_anchor: 内部中位、临时安次、资源在怀、可信支持
  stable_path: 少阴8保持六二，以中正稳住住所和资源，在无六五正应时借可靠支持维持旅程。
  changing_path: 太阴6由阴转阳，旅变鼎；内部落脚点取得主动组织力，临时资源进入可转化、可供给的稳定容器。
