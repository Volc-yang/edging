    planetary_natural: 生态指标在自然波动范围内短暂偏移时持续观测，不贸然大规模改造；越过阈值再调查干预。
    social_organizational: 单次轻微指标波动先核验数据和趋势，不立即重组团队；持续失常才进入正式问题处理。
    individual: 轻微且熟悉的短暂不适可按专业指引观察并设就医阈值，不因焦虑自行滥用药物。
    biological: 稳态系统对小幅扰动先通过内源反馈恢复，持续危险信号才启动高成本防御。
    microscopic_min: 滤波器忽略处于噪声带内的单次脉冲，只有重复越阈信号才触发隔离和校正。
  scale_mapping: 各尺度都由小幅瞬态、可靠反馈、自稳窗口和越阈后的程序升级组成；时间上先观察趋势，空间上由中心监测转向障碍定位。
  scale_boundary: 本抽象不是医疗建议；突发、严重、持续或不明症状必须及时由合格专业人员评估，高风险系统也不得以“自限”为由延误处置。
